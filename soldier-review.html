<!doctype html>
<html lang="ja">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>兵士・ゲーム動作検証</title>
  <style>
    body {
      margin: 0;
      background: #16212b;
      color: #eef4f5;
      font: 16px system-ui;
    }
    header {
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    select,
    button {
      font: inherit;
      padding: 7px;
      background: #26394a;
      color: white;
      border: 1px solid #678;
      border-radius: 5px;
    }
    canvas {
      display: block;
    }
    #status {
      font-size: 13px;
    }
  </style>
  <header>
    <strong>兵士・ゲーム動作検証</strong
    ><label
      >動作
      <select id="mode">
        <option value="idle">待機</option>
        <option value="walk">歩行</option>
        <option value="run">走行</option>
        <option value="back">後退</option>
        <option value="aim">照準</option>
        <option value="fire">射撃</option>
        <option value="walk-fire">歩きながら射撃</option>
        <option value="reload">装填</option>
        <option value="walk-reload">歩きながら装填</option>
        <option value="switch">武器切替</option>
        <option value="roll">回避</option>
        <option value="heavy">被弾</option>
        <option value="down">倒れる</option>
      </select></label
    ><label
      >武器
      <select id="weapon">
        <option value="rifle">ライフル</option>
        <option value="shotgun">散弾銃</option>
        <option value="rocket">ロケット</option>
      </select></label
    ><label
      >速度
      <select id="speed">
        <option value="1">通常</option>
        <option value="0.25">1/4</option>
      </select></label
    ><button id="step">1コマ</button><button id="advance">0.5秒進める</button
    ><output id="clock">0.000秒</output><button id="pause">一時停止</button
    ><button id="front">正面</button><button id="side">側面</button
    ><button id="rear">背面</button><button id="close">1人を拡大</button
    ><span id="status">読み込み中</span>
  </header>
  <script
    type="module"
    src="/src/client/soldier-review.ts?review=low-evade-bea488"
  ></script>
</html>
