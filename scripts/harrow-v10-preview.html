<!doctype html><html lang="ja"><meta charset="utf-8"><title>HARROW 胴体と飛行模倣</title>
<style>body{margin:0;background:#19222a;color:#edf2f4;font:15px sans-serif}canvas{display:block;width:100vw;height:calc(100vh - 90px)}nav{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:6px;background:#304451;color:white;border:1px solid #66808b;border-radius:5px}input{width:220px}#status{font-size:12px}</style>
