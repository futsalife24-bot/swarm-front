<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PLEAT 接地歩行の確認</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #091419;
        color: #e4f4ef;
        font: 14px system-ui;
        overflow: hidden;
      }
      header {
        position: absolute;
        z-index: 2;
        top: 12px;
        left: 14px;
        right: 14px;
        display: flex;
        gap: 7px;
        align-items: center;
        flex-wrap: wrap;
      }
      strong {
        margin-right: 12px;
        color: #b9f3dd;
      }
      button {
        background: #20363d;
        border: 1px solid #668a89;
        color: #e4f4ef;
        padding: 7px 11px;
        border-radius: 3px;
        cursor: pointer;
      }
      button:hover {
        background: #365350;
      }
      #stats {
        position: absolute;
        bottom: 12px;
        left: 14px;
        background: #071116dd;
        padding: 12px;
        border-left: 3px solid #77dfbf;
        white-space: pre-line;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }
      #status {
        position: absolute;
        top: 60px;
        left: 15px;
        color: #f0dca1;
        pointer-events: none;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>PLEAT ／ 接地歩行</strong><button id="play">一時停止</button
      ><button id="reset">最初から</button
      ><button id="step">0.25秒進める</button><button data-view="0">床</button
      ><button data-view="1">壁</button><button data-view="2">天井</button
      ><button data-view="3">縁の裏側</button
      ><button id="follow">接近表示</button>
    </header>
    <div id="status">モデルを読み込んでいます</div>
    <div id="stats"></div>
    <script type="module" src="./pleat-surface-review.ts"></script>
  </body>
</html>
