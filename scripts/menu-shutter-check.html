<!doctype html>
<html lang="ja">
  <meta charset="utf-8" /><title>分割シャッター回帰検証</title>
  <style>
    :root {
      color: #e3edee;
      font: 16px system-ui;
    }
    body {
      margin: 0;
      background: #0c1820;
    }
    #run,
    button {
      padding: 12px;
    }
    #ui {
      position: relative;
      width: 844px;
      height: 390px;
      overflow: auto;
    }
    .menu-screen {
      padding: 12px;
      background: #183038;
    }
    pre {
      white-space: pre-wrap;
    }
  </style>
  <button id="run">検証開始</button>
  <pre id="result">未実施</pre>
  <main id="ui"></main>
  <script type="module">
    import { mountScreenTransitions } from "/src/client/screen-transition.ts";
    const root = document.querySelector("#ui"),
      output = document.querySelector("#result"),
      results = [];
    const wait = (ms) => new Promise((r) => setTimeout(r, ms)),
      frame = () => new Promise(requestAnimationFrame);
    const assert = (v, m) => {
      if (!v) throw Error(m);
    };
    const render = (name = "基地") => {
      root.innerHTML = `<section class="menu-screen"><h1>${name}</h1><button id="go">開く</button><button id="local">並び替え</button><div id="list"></div></section>`;
    };
    const reset = () => {
      window.dispatchEvent(new Event("resize"));
      for (const d of document.querySelectorAll("dialog")) d.remove();
      document.documentElement.dataset.menuReducedMotion = "false";
      document.dispatchEvent(new Event("swarm-motion-preference"));
      render();
    };
    mountScreenTransitions(root);
    document.querySelector("#run").onclick = async () => {
      results.length = 0;
      output.textContent = "検証中";
      try {
        reset();
        root.querySelector("#local").onclick = () => render();
        root.querySelector("#local").click();
        await frame();
        assert(!document.querySelector(".split-shutter"), "同一画面更新");
        results.push("同一画面の再描画は演出なし");
        reset();
        const before = root.querySelector("#go").getBoundingClientRect();
        root.querySelector("#go").onclick = () => render("工房");
        root.querySelector("#go").click();
        await frame();
        let layer = document.querySelector(".split-shutter");
        assert(layer?.children.length === 6, "6分割");
        assert(
          layer.querySelectorAll("[id]").length === 0,
          "実DOMのID競合なし",
        );
        assert(
          layer.inert && layer.getAttribute("aria-hidden") === "true",
          "読み上げとフォーカス対象外",
        );
        const shadow = layer.firstElementChild.shadowRoot;
        assert(shadow.querySelector("#go"), "旧画面の内容");
        assert(
          shadow.querySelector("h1").textContent === "基地",
          "旧画面の見出し保持",
        );
        results.push("6分割・旧画面保持・IDとアクセシビリティ分離");
        let calls = 0;
        root.querySelector("#go").onclick = () => calls++;
        root.querySelector("#go").click();
        assert(calls === 0, "見えないボタンへの連打抑止");
        await wait(600);
        root.querySelector("#go").click();
        assert(calls === 1, "演出後の操作解除");
        results.push("遷移中の連打抑止と終了後の解除");
        reset();
        root.querySelector("#go").onclick = () => {
          const d = document.createElement("dialog");
          d.innerHTML = "<h2>詳細</h2><button>閉じる</button>";
          document.body.append(d);
          setTimeout(() => d.showModal(), 80);
        };
        root.querySelector("#go").click();
        await wait(150);
        assert(document.querySelector(".split-shutter"), "遅れて開くdialog");
        window.dispatchEvent(new Event("resize"));
        assert(!document.querySelector(".split-shutter"), "resize解除");
        results.push("非同期dialog表示・resize解除");
        reset();
        const d = document.createElement("dialog");
        d.innerHTML = "<h2>詳細</h2><button>閉じる</button>";
        document.body.append(d);
        d.showModal();
        d.querySelector("button").onclick = () => {
          d.close();
          d.remove();
        };
        d.querySelector("button").click();
        await frame();
        assert(document.querySelector(".split-shutter"), "dialog閉じる");
        document.documentElement.dataset.menuReducedMotion = "true";
        document.dispatchEvent(new Event("swarm-motion-preference"));
        assert(!document.querySelector(".split-shutter"), "設定変更で除去");
        results.push("dialogを閉じる・途中で軽減設定");
        reset();
        document.documentElement.dataset.menuReducedMotion = "true";
        root.querySelector("#go").onclick = () => render("設定");
        root.querySelector("#go").click();
        await frame();
        assert(!document.querySelector(".split-shutter"), "軽減時演出なし");
        results.push("軽減設定で即時遷移");
        reset();
        root.querySelector("#go").onclick = () => {
          root.innerHTML = '<div class="hud">戦闘</div>';
        };
        root.querySelector("#go").click();
        await frame();
        assert(!document.querySelector(".split-shutter"), "戦闘を覆わない");
        results.push("戦闘HUDは対象外");
        reset();
        const list = root.querySelector("#list");
        list.innerHTML = Array.from(
          { length: 160 },
          (_, i) => `<p>武器${i}<button data-lock>ロック</button></p>`,
        ).join("");
        root.scrollTop = 200;
        root.querySelector("#go").onclick = () => render("別画面");
        const at = performance.now();
        root.querySelector("#go").click();
        await frame();
        const elapsed = Math.round(performance.now() - at);
        assert(document.querySelector(".split-shutter"), "一覧からの遷移");
        results.push(
          `160件一覧から帯の生成まで ${elapsed}ms（この実行環境の参考値）`,
        );
        window.dispatchEvent(new Event("resize"));
        assert(!document.querySelector(".split-shutter"), "装飾残留なし");
        output.textContent = JSON.stringify(
          {
            pass: true,
            checks: results,
            generatedAt: new Date().toISOString(),
          },
          null,
          2,
        );
      } catch (error) {
        output.textContent = JSON.stringify(
          { pass: false, checks: results, error: String(error) },
          null,
          2,
        );
      }
    };
  </script>
</html>
