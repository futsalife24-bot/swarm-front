<!doctype html>
<html lang="ja">
  <meta charset="utf-8" /><title>HARROW 実戦検証</title>
  <style>
    body {
      margin: 0;
      background: #152026;
      color: white;
      font: 14px sans-serif;
    }
    canvas {
      display: block;
    }
    aside {
      position: fixed;
      left: 8px;
      top: 8px;
      background: #10202fdd;
      padding: 8px;
      max-width: 440px;
    }
    button {
      padding: 8px;
      margin: 2px;
    }
    pre {
      font-size: 11px;
      white-space: pre-wrap;
      max-height: 190px;
      overflow: auto;
    }
  </style>
  <canvas></canvas>
  <div
    id="damage"
    aria-hidden="true"
    style="position: fixed; inset: 0; pointer-events: none"
  ></div>
  <aside>
    HARROW · 実ゲーム描画
    <div>
      <button data-mode="walk">ゆっくり歩行</button
      ><button data-mode="encounter">空中会敵</button
      ><button data-mode="missile">空中ミサイル</button
      ><button data-mode="ground-missile">地上山なり10発</button
      ><button data-mode="dash">短ダッシュ</button
      ><button data-mode="snipe">直射</button
      ><button data-mode="bomb">爆撃通過</button
      ><button data-mode="takeoff">離陸</button
      ><button data-mode="spin">翼接地回転</button
      ><button data-mode="dive">滑空ダイブ</button
      ><button data-mode="fall">怯み落下</button
      ><button id="pause">一時停止</button
      ><button id="advance">0.5秒進める</button
      ><button id="camera">地面を見る</button>
    </div>
    <div>
      <label
        >選択動作の時刻
        <input
          id="seek-time"
          type="number"
          min="0"
          max="20"
          step="0.05"
          value="0"
          style="width: 65px" /></label
      ><button id="seek">指定時刻へ</button>
    </div>
    <div>
      回転時刻: <button data-time="0">0</button
      ><button data-time="0.6">0.6</button>
      <button data-time="1.15">1.15</button><button data-time="1.4">1.4</button>
      <button data-time="1.675">1.675</button
      ><button data-time="1.95">1.95</button>
      <button data-time="2.2">2.2</button><button data-time="2.6">2.6</button
      ><button data-time="3">3</button>
    </div>
    <button id="overview">俯瞰切替</button
    ><button id="side-view">側面切替</button
    ><button id="capture">静止画像を保存</button
    ><button id="record">選択中の動作を録画</button>
    <pre id="saved"></pre>
    <pre id="status">読込中</pre>
  </aside>
  <script type="module" src="./harrow-preview.ts"></script>
</html>
