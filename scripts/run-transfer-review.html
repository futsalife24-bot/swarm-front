<!doctype html><meta charset="utf-8"><title>Swarm Front / Run comparison</title>
<style>body{margin:0;background:#142129;color:#e7f4fa;font:14px system-ui}header{display:flex;gap:7px;flex-wrap:wrap;padding:8px;align-items:center}button,select{padding:7px;background:#263c49;color:white;border:1px solid #667e88;border-radius:4px}canvas{width:100%;max-height:calc(100vh - 96px);object-fit:contain}#status{padding:5px}</style>
<header><b>走り比較</b><button data-key="current">0 現行</button><button data-key="jog">A Jog</button><button data-key="sprint" id="sprint" disabled>B Sprint（未生成）</button><select id="view"><option value="side">側面</option><option value="back">背面</option><option value="game">ゲーム視点</option></select><select id="weapon"><option>rifle</option><option>shotgun</option><option>rocket</option></select><button id="pause">一時停止</button><select id="rate"><option value="1">通常速度</option><option value="0.25">0.25倍</option></select><select id="travel"><option value="move">地面を移動</option><option value="place">その場</option></select><button id="reset">現行へ戻す</button><a id="play" href="/?runTrial=jog" style="color:#a5e8df">実ゲーム操作</a></header><div id="status">読込中</div><div id="screen"></div>
<script type="module">
import * as T from 'three';
import {StandardTrooper,loadStandardTrooper,TROOPER_RUN_STRIDE} from '/src/client/standard-trooper.ts';
import {loadRunTrial} from '/src/client/run-trial.ts';
import {createWorld,addPlayer,start,step,neutral,spawn} from '/src/shared/game.ts';
import {STARTERS,MOVE_SPEED} from '/src/shared/defs.ts';
const loaded=await loadStandardTrooper();
// Keep the original v7 baseline visible after the public B adoption. Its 18
// original clips and geometry are retained in v8; omit only the appended clip.
const assets={...loaded,runTrial:undefined,character:{...loaded.character,animations:loaded.character.animations.filter(c=>c.name!=='UAL_sprint')}},trials={current:null,jog:await loadRunTrial('jog')};
try{trials.sprint=await loadRunTrial('sprint');document.querySelector('#sprint').disabled=false;document.querySelector('#sprint').textContent='B Sprint'}catch{}
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1280,640);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;
const canvas=document.createElement('canvas');canvas.width=1280;canvas.height=720;document.querySelector('#screen').append(canvas);const ctx=canvas.getContext('2d');
const camera=new T.PerspectiveCamera(38,1,.01,300),scenes=[];
for(let i=0;i<2;i++){const s=new T.Scene();s.background=new T.Color('#29363c');s.add(new T.HemisphereLight(0xe7f2ff,0x4b4540,2));const l=new T.DirectionalLight(0xffffff,3);l.position.set(-3,5,-4);s.add(l);const floor=new T.Mesh(new T.PlaneGeometry(500,500),new T.MeshStandardMaterial({color:0x38433f}));floor.rotation.x=-Math.PI/2;floor.position.y=-.004;s.add(floor);s.add(new T.GridHelper(500,1000,0x6f7e74,0x4e5b53));scenes.push(s)}
let models=[],players=[],key='jog',elapsed=0,paused=false,measuring=false,last=performance.now();
function reset(k=key,kind=document.querySelector('#weapon').value){key=k;models.forEach(t=>t.dispose());models=[new StandardTrooper(assets),new StandardTrooper({...assets,runTrial:trials[k]??undefined})];players=models.map((t,i)=>{scenes[i].add(t.model);const w=createWorld('review'+i),p=addPlayer(w,'p',[STARTERS.find(x=>x.kind===kind),STARTERS.find(x=>x.kind===(kind==='rocket'?'rifle':'rocket'))]);start(w);p.x=0;p.z=0;w.enemies=[];w.nextSpawn=1e9;return p});elapsed=0;document.querySelector('#play').href=key==='current'?'/':'/?runTrial='+key;document.querySelector('#status').textContent=`${trials[key]?.name??'現行'} | 移動 ${MOVE_SPEED.walk} m/s | 1周期 ${ (trials[key]?.stride??TROOPER_RUN_STRIDE).toFixed(3)} m | 素材再生倍率 ${trials[key]?(7*trials[key].clip.duration/trials[key].stride).toFixed(3):'現行'} | 後退は全候補で現行を保持`;}
function tick(dt=1/60,moving=true,direction={x:0,z:-1}){elapsed+=dt;const length=Math.hypot(direction.x,direction.z)||1;for(let i=0;i<2;i++){const p=players[i];if(moving){p.x+=direction.x/length*MOVE_SPEED.walk*dt;p.z+=direction.z/length*MOVE_SPEED.walk*dt}models[i].update(p,0,elapsed,'comparison',dt);models[i].model.position.set(document.querySelector('#travel').value==='move'?p.x:0,0,document.querySelector('#travel').value==='move'?p.z:0)}}
function draw(view=document.querySelector('#view').value,label=''){renderer.setScissorTest(true);models.forEach((t,i)=>{const {x,z}=t.model.position;camera.position.set(...({side:[x+4.9,1.2,z],back:[x,1.5,z+4.9],game:[x,3.1,z+5.8],oblique:[x+3.8,2.2,z+4.8]}[view]));camera.lookAt(x,.95,z);renderer.setViewport(i*640,0,640,640);renderer.setScissor(i*640,0,640,640);renderer.render(scenes[i],camera)});ctx.fillStyle='#142129';ctx.fillRect(0,0,1280,720);ctx.drawImage(renderer.domElement,0,50);ctx.font='bold 26px sans-serif';ctx.fillStyle='#e9f3f6';ctx.fillText('0  CURRENT / 現行',18,34);ctx.fillStyle='#8cebc5';ctx.fillText(key==='current'?'0 CURRENT':`${key==='jog'?'A':'B'}  ${trials[key].name}`,657,34);ctx.font='19px sans-serif';ctx.fillStyle='#ecf3f6';ctx.fillText(label||`${view.toUpperCase()} | ${players[0].weapons[players[0].slot].kind} | 7 m/s | speed ${document.querySelector('#rate').value}x | same rig / equipment / camera`,18,714);}
function frame(now){if(!measuring){if(!paused)tick(Math.min(.05,(now-last)/1000)*Number(document.querySelector('#rate').value));draw()}last=now;requestAnimationFrame(frame)}
document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>reset(b.dataset.key));document.querySelector('#reset').onclick=()=>reset('current');document.querySelector('#weapon').onchange=()=>reset();document.querySelector('#pause').onclick=()=>{paused=!paused};
reset();requestAnimationFrame(frame);
window.review={reset,tick,draw,models:()=>models,players:()=>players,canvas,freeze:()=>{measuring=true},trials};window.ready=true;
</script>
