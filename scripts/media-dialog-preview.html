<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>Media dialog lifecycle regression</title>
<style>body { font: 16px sans-serif; background:#18252c; color:white; } button,a { margin:8px; padding:10px; } dialog { background:#20343d; color:white; width:600px; } video { max-height:120px; } pre { white-space:pre-wrap; }</style>
<h1>全画面待機中の親close</h1>
<p>検証専用。全画面要求のPromiseだけを遅らせ、実際のdialogと製品の終了処理を使います。</p>
<button id="start">設定を開く</button><button id="resolve">全画面待ちを解決</button><button id="reject">全画面待ちを失敗</button><button id="check">状態を記録</button>
<label><input id="auto-close" type="checkbox" checked>読み込み開始直後に親を閉じる（オフなら親の閉じるを手動操作）</label>
<a href="?before=1">修正前</a><a href="?">修正後</a>
<div id="portrait" hidden><button id="landscape-start">開始</button><span id="landscape-status"></span></div>
<pre id="status"></pre>
<script type="module">
import { menuDialog } from '/src/client/menu-ui.ts';
import { backgroundMusic } from '/src/client/bgm.ts';
import { installLandscapeGuard } from '/src/client/landscape.ts';
const before = new URL(location.href).searchParams.has('before');
const { mountMediaMenu } = await import(/* @vite-ignore */ before ? '/dist-validation/media-menu/media-menu-before.ts' : '/src/client/media-menu.ts');
let resolveRequest;
let rejectRequest;
let installed = false;
let pendingCount = 0;
let fullscreenOutcome = 'not-requested';
let observers = 0, disconnected = 0, urls = 0, revoked = 0, requests = 0, aborted = 0;
let dialogObservers = 0, disconnectedDialogObservers = 0;
for (const name of ['ResizeObserver', 'MutationObserver']) {
  const Base = window[name];
  window[name] = class extends Base {
    stopped = false;
    owned = false;
    constructor(callback) { super(callback); observers++; }
    observe(target, options) { if (!this.owned && target.closest?.('dialog')) { this.owned = true; dialogObservers++; } super.observe(target, options); }
    disconnect() { if (!this.stopped) { disconnected++; if (this.owned) disconnectedDialogObservers++; this.stopped = true; } super.disconnect(); }
  };
}
const makeUrl = URL.createObjectURL.bind(URL), freeUrl = URL.revokeObjectURL.bind(URL);
URL.createObjectURL = (blob) => { urls++; return makeUrl(blob); };
URL.revokeObjectURL = (url) => { revoked++; freeUrl(url); };
const fetchMedia = window.fetch.bind(window);
window.fetch = (url, options) => { requests++; options?.signal?.addEventListener('abort', () => aborted++, { once:true }); return fetchMedia(url, options); };
const bgm = backgroundMusic();
bgm.setScreen('title');
const status = document.querySelector('#status');
const snapshot = () => {
  const a = document.querySelector('audio[data-bgm]');
  status.textContent = JSON.stringify({ before, pendingCount, fullscreenOutcome, dialogs:document.querySelectorAll('dialog').length, previews:document.querySelectorAll('.media-dialog').length, openPreviews:document.querySelectorAll('.media-dialog[open]').length, bgmPaused:a.paused, bgmTrack:a.dataset.track, observers, disconnected, dialogObservers, disconnectedDialogObservers, urls, revoked, requests, aborted }, null, 2);
};
document.querySelector('#start').onclick = () => {
  const autoClose = document.querySelector('#auto-close').checked;
  const owner = menuDialog('親設定', '');
  mountMediaMenu(owner, () => .35);
  for (const button of owner.querySelectorAll('.settings-media button')) {
    // Same timing as a scene transition/room disconnect while showing the child.
    button.addEventListener('click', () => { if (autoClose) owner.close(); setTimeout(snapshot, 30); });
  }
  if (!installed) {
    installed = true;
    Object.defineProperty(navigator, 'maxTouchPoints', { configurable:true, value:1 });
    document.documentElement.requestFullscreen = () => {
      pendingCount++;
      fullscreenOutcome = 'pending';
      const promise = new Promise((resolve, reject) => { resolveRequest = resolve; rejectRequest = reject; });
      void promise.then(() => fullscreenOutcome = 'fulfilled', () => fullscreenOutcome = 'rejected');
      return promise;
    };
    installLandscapeGuard(() => {});
  }
};
document.querySelector('#resolve').onclick = () => { resolveRequest?.(); setTimeout(snapshot, 30); };
document.querySelector('#reject').onclick = () => { rejectRequest?.(new Error('Controlled fullscreen failure')); setTimeout(snapshot, 30); };
document.querySelector('#check').onclick = snapshot;
snapshot();
</script>
</html>
