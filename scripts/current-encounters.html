<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>現行ANOMALY 会敵映像収録</title>
    <style>
      body {
        margin: 0;
        background: #08131d;
        color: #f4f5e9;
        font: 14px sans-serif;
      }
      main {
        max-width: 1280px;
        margin: auto;
        padding: 12px;
      }
      #world {
        position: absolute;
        opacity: 0;
        pointer-events: none;
        width: 1280px;
        height: 720px;
      }
      #film {
        display: block;
        width: 100%;
        height: auto;
        background: #05090d;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
      }
      label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      input[type="range"] {
        width: 140px;
      }
      button,
      select {
        padding: 8px 12px;
        font: inherit;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <main>
      <canvas
        id="film"
        width="1280"
        height="720"
        aria-label="会敵映像のプレビュー"
      ></canvas>
      <div class="controls">
        <label
          >対象
          <select id="kind"></select
        ></label>
        <label
          >距離
          <input
            id="distance"
            type="range"
            min="3"
            max="300"
            step="0.5" /><output id="distance-value"></output
        ></label>
        <label
          >画角
          <input id="fov" type="range" min="28" max="65" step="1" /><output
            id="fov-value"
          ></output
        ></label>
        <button id="preview" type="button">プレビュー更新</button>
        <button id="record" type="button" disabled>選択した1種を収録</button>
        <button id="record-all" type="button" disabled>全9種を収録</button>
        <button id="record-from" type="button" disabled>
          選択した種から残りを収録
        </button>
      </div>
      <pre id="status" role="status">読み込み中…</pre>
    </main>
    <script type="module" src="./current-encounters.ts"></script>
  </body>
</html>
