<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ANOMALY 攻撃段階確認</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #091016;
        color: #edf4f4;
        font:
          14px system-ui,
          sans-serif;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 270px;
        height: 100dvh;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      aside {
        overflow: auto;
        padding: 10px;
        background: #13212b;
        border-left: 1px solid #52636b;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      h2 {
        font-size: 12px;
        margin: 10px 0 4px;
        color: #bdd0d6;
      }
      button {
        color: #f4f7f7;
        background: #314c58;
        border: 1px solid #69818b;
        border-radius: 4px;
        padding: 5px 7px;
        margin: 2px;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: #9c3245;
        border-color: #fa8798;
      }
      button:hover {
        filter: brightness(1.2);
      }
      #species,
      #attacks {
        display: flex;
        flex-wrap: wrap;
      }
      #time {
        width: 100%;
        accent-color: #e34a60;
      }
      #status {
        font-variant-numeric: tabular-nums;
        min-height: 38px;
        line-height: 1.4;
        white-space: pre-line;
      }
      @media (max-width: 700px) {
        main {
          grid-template-columns: minmax(0, 1fr) 210px;
        }
        aside {
          padding: 6px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <canvas
        aria-label="実ゲームRendererによるANOMALYモデルと攻撃予告"
      ></canvas>
      <aside>
        <h1>ANOMALY 攻撃段階</h1>
        <div id="species"></div>
        <h2>攻撃</h2>
        <div id="attacks"></div>
        <h2>時刻</h2>
        <input id="time" type="range" min="0" max="4" step="0.01" value="0" />
        <div id="status"></div>
        <a
          id="state-url"
          href="#"
          style="color: #b6d9e0; overflow-wrap: anywhere"
          >現在状態のURL</a
        >
        <div>
          <a
            id="png-link"
            href="#"
            download="anomaly.png"
            style="color: #b6d9e0"
            >PNGダウンロード</a
          >
        </div>
        <div>
          <button id="prepare">構え</button><button id="warning">赤予告</button
          ><button id="impact">攻撃</button>
        </div>
        <div>
          <button id="play">再生</button><button id="front">正面/斜め</button
          ><button id="view">姿勢/範囲</button
          ><button id="save">PNG保存</button>
        </div>
      </aside>
    </main>
    <script type="module" src="./anomaly-anticipation-preview.ts"></script>
  </body>
</html>
