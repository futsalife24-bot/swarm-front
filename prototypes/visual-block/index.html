<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SwarmFront 街区比較</title>
<style>body{margin:0;background:#111;color:#eee;font:14px system-ui;overflow:hidden}canvas{display:block}nav{position:fixed;top:12px;left:12px;padding:12px;background:#132027e8;border:1px solid #71828c;border-radius:6px}button{padding:8px 12px;margin:2px;background:#263c48;color:white;border:1px solid #71828c;border-radius:4px}button[aria-pressed=true]{background:#496957}small{display:block;margin-top:6px}#status{position:fixed;bottom:14px;left:14px;background:#132027df;padding:8px}#cross{position:fixed;left:50%;top:50%;font-size:24px;transform:translate(-50%,-50%);pointer-events:none}#damage{position:fixed;inset:0;pointer-events:none}</style>
<canvas id="game"></canvas><div id="damage"></div><div id="cross">+</div>
<nav>SWARMFRONT / 市街地・比較試作<br><button id="before">A 現行</button><button id="after">B 改善版</button><button id="reset">同じ位置へ</button><button id="pause">停止 / 再開</button><br><button id="inspect">装備を近くで確認</button><button id="crowd">40体で確認</button><small>WASD 移動 · ← → 視点 · Space 射撃 · R 装填 · Q 切替 · E 回避<br>通常画面の画角65°・カメラ距離はA/B共通。</small></nav>
<div id="touch"><button data-key="KeyW">前進</button><button data-key="KeyS">後退</button><button data-key="ArrowLeft">↶</button><button data-key="ArrowRight">↷</button><button data-key="Space">射撃</button><button data-key="KeyE">回避</button></div>
<style>#touch{display:none;position:fixed;bottom:8px;left:8px;right:8px;justify-content:space-between;touch-action:none}#status{left:auto;right:12px;max-width:180px;font-size:12px}nav{max-width:440px}@media(max-width:900px){nav{font-size:11px;padding:6px;max-width:330px}nav button{font-size:11px;padding:5px 8px}#status{top:12px;bottom:auto;max-width:140px;font-size:10px}#touch{display:flex}small{font-size:10px}}</style>
<div id="status">読み込み中…</div><script type="module" src="./scene.js"></script></html>
