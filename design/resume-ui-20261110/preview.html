<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b0f">
<title>補給ポッド演出プレビュー</title>
<link rel="icon" href="data:,">
<link rel="preload" as="image" href="./supply-reveal/assets/pod-512.webp" type="image/webp">
<link rel="stylesheet" href="./preview.css">
<link rel="stylesheet" href="./supply-reveal/supply-reveal.css">
</head>
<body>
<!-- 横画面プレビュー：表示専用。確率・券の配布・天井・レア度の仕様・保存は扱わない。入力した確定済みの結果だけを再生する。 -->
<main id="launcher" class="launcher" aria-labelledby="launcher-title">
  <header class="l-head">
    <h1 id="launcher-title">アイテム</h1>
    <p class="l-note">演出プレビュー：確率・配布・報酬は未確定。入力した結果をそのまま再生します。</p>
  </header>
  <div id="resume" class="l-resume" hidden>
    <span>前回の演出が途中で中断されました。結果は確定済みです。</span>
    <button type="button" id="resume-open">結果を見る</button>
    <button type="button" id="resume-drop" class="ghost">破棄</button>
  </div>
  <section class="l-row" aria-label="配布券（仮）">
    <span class="l-icon" aria-hidden="true"></span>
    <div class="l-item">
      <b>配布券（仮）</b>
      <small>使うと補給ポッドを受け取ります</small>
    </div>
    <button type="button" class="use" data-use="1">1回使う</button>
    <button type="button" class="use" data-use="10">10回使う</button>
  </section>
  <section class="l-grid" aria-label="プレビューの入力と設定">
    <label>1回の入力
      <select id="preset1"></select>
    </label>
    <label>10回の入力
      <select id="preset10"></select>
    </label>
    <label class="chk"><input type="checkbox" id="opt-fast">高速（2倍）</label>
    <label class="chk"><input type="checkbox" id="opt-reduce">動きを減らす</label>
    <label class="chk"><input type="checkbox" id="opt-debug">検証用シークバー</label>
    <details class="l-json">
      <summary>結果配列をJSONで入力</summary>
      <textarea id="json" spellcheck="false" rows="5" aria-label="結果配列JSON"></textarea>
      <div class="l-json-actions">
        <button type="button" id="json-play">この配列を再生</button>
        <span id="json-msg" role="status"></span>
      </div>
    </details>
  </section>
</main>
<div class="dbg" hidden>
  <input type="range" id="dbg-seek" min="0" max="1000" value="0" aria-label="再生位置">
  <output id="dbg-time">0.00s</output>
  <button type="button" id="dbg-interrupt">中断テスト</button>
</div>
<script type="module" src="./preview.js"></script>
</body>
</html>
