  .strip { display: flex; gap: 6px; margin: 4px 16px; }
  .strip div { background: #11232f; text-align: center; font-size: 11px; color: #9fb3bd; padding: 3px 4px; border-radius: 4px; }

function draw(w, width, height, mono) {
  const col = (c) => mono ? "#dfe9ee" : c === "b" ? w.body : c === "a" ? (w.accent ?? w.body) : c === "g" ? (w.glow ?? "#fff")
    : c === "d" ? "#3a4850" : c;
  const pts = (p) => p.map(([f, u]) => `${f},${-u}`).join(" ");
  const body = w.shapes.map((s) => {
    if (s[0] === "P") return `<polygon points="${pts(s[2])}" fill="${col(s[1])}"/>`;
    if (s[0] === "R") return `<rect x="${s[2]}" y="${-s[5]}" width="${s[4] - s[2]}" height="${s[5] - s[3]}" fill="${col(s[1])}"/>`;
    if (s[0] === "E") return `<ellipse cx="${s[2]}" cy="${-s[3]}" rx="${s[4]}" ry="${s[5]}" fill="${col(s[1])}"/>`;
    return `<${s[3] ? "polygon" : "polyline"} points="${pts(s[4])}" fill="none" stroke="${col(s[1])}" stroke-width="${s[2]}" stroke-linejoin="round"/>`;
  }).join("");
  const cross = mono || width < 200 ? "" : `<path d="M-.012 0H.012M0 -.012V.012" stroke="#ffd472" stroke-width=".003"/>`;
  return `<svg width="${width}" height="${height}" viewBox="-0.43 -0.225 1.16 0.49">${body}${cross}</svg>`;
