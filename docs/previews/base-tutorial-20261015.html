<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基地・初回導入の相談モック</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#081923;color:#e6edf0;font-family:"Yu Gothic UI",Meiryo,sans-serif}button{font:inherit;cursor:pointer}button:disabled{cursor:not-allowed}.wrap{max-width:1100px;margin:auto;padding:18px}.note{color:#aec0c8;font-size:13px;line-height:1.6}.switch{display:flex;gap:6px;margin:14px 0}.switch button,.nav button{color:#e6edf0;background:#203943;border:1px solid #69818a;padding:8px 12px;min-height:36px}.switch button[aria-pressed="true"]{background:#315c56;border-color:#d6bd79}.stage{width:min(100%,844px);aspect-ratio:844/390;min-height:390px;margin:auto;border:1px solid #42616a;background:linear-gradient(145deg,#0d2632,#11232b);padding:10px;box-shadow:0 14px 40px #0008;display:flex;flex-direction:column;gap:8px}.header{display:flex;align-items:center;border-bottom:1px solid #45616a;padding-bottom:6px;gap:12px}.eyebrow{font-size:9px;letter-spacing:.2em;color:#8faeb6}.header h1{font-size:22px;margin:0}.nav{display:flex;gap:5px;margin-left:auto}.nav button{padding:6px 8px;font-size:11px}.wallet{display:flex;gap:7px;font-size:11px;color:#d0dfdf;min-height:25px;align-items:center}.wallet span{padding:4px 9px;border:1px solid #46616b;background:#18323c}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:9px;flex:1;min-height:0}.card{position:relative;text-align:left;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:4px;padding:12px 15px;color:#ecf4f3;background:linear-gradient(120deg,#1c3a42,#193039);border:1px solid #668288;min-width:0}.card strong{font-size:21px}.card .desc{font-size:12px;color:#d1dedf}.card small{font-size:11px;color:#a9c0c5}.card:hover:not(:disabled){border-color:#dcc07e;background:#244951}.card:disabled{filter:grayscale(1);opacity:.58}.card .end{position:absolute;right:14px;top:14px;color:#d9bc78}.proposal .card{border-left:3px solid #c6aa6f}.proposal .card strong{font-size:19px}.proposal .card small{color:#e0be78}.proposal .card[disabled] small{color:#b8c5c6}.proposal .base-hint{font-size:11px;color:#acc0c7}.hidden{display:none!important}.flow{max-width:844px;margin:25px auto 0}.flow h2{font-size:18px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.steps button{background:#19333d;border:1px solid #5b7881;color:#eef4f4;text-align:left;padding:9px;min-height:65px}.steps button[aria-current="step"]{border-color:#d7ba79;background:#2c4c4c}.steps small{display:block;color:#c7d6d9;margin-top:4px}.flow-detail{border:1px solid #5b7881;background:#122b35;padding:13px;margin-top:8px;min-height:80px;line-height:1.6}.flow-detail p{margin:0}.fine{font-size:12px;color:#b7cbd0}@media(max-width:700px){.wrap{padding:8px}.stage{min-height:375px}.header{gap:5px}.header h1{font-size:18px}.nav button{font-size:10px;padding:5px}.card{padding:8px}.card strong{font-size:16px}.card .desc,.card small{font-size:10px}.steps{grid-template-columns:repeat(2,1fr)}}
.item-preview{max-width:844px;margin:24px auto 0}.item-preview h2{font-size:18px}.item-tabs{display:flex;gap:6px}.item-tabs button{background:#203943;border:1px solid #69818a;color:#e6edf0;min-height:36px;padding:6px 13px}.item-tabs button[aria-selected="true"]{background:#315c56;border-color:#d6bd79}.item-panel{background:#122b35;border:1px solid #5b7881;padding:11px;margin-top:7px;min-height:125px}.item-panel h3{margin:0 0 7px;font-size:15px}.item-panel p{margin:0 0 8px;color:#c3d3d7;font-size:12px}.mini-row{display:flex;align-items:center;gap:8px;border:1px solid #526d75;padding:8px;min-height:38px;font-size:11px}.mini-row span{flex:1}.mini-row strong{color:#e6ca86}.mini-row em{font-style:normal;color:#b8cbd0}.mini-action{border:1px solid #6d858b;background:#24424a;padding:4px 7px}.mini-four{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.mini-four span{border:1px solid #526d75;padding:8px;font-size:11px}.mini-four b{display:block;color:#e6ca86}@media(max-width:700px){.mini-row{flex-wrap:wrap}.mini-four{grid-template-columns:repeat(2,1fr)}}
</style>
<div class="wrap">
  <h1>基地・初回プレイの相談用モック</h1>
  <p class="note">既存の横画面、色、共通ヘッダー、2×2カードと4入口を踏襲した静的比較です。数値は表示例です。操作・保存・公開画面ではありません。</p>
  <div class="switch"><button id="current" aria-pressed="false">現行の情報構成</button><button id="proposal" aria-pressed="true">改善案</button></div>
  <div class="stage">
    <div class="header"><div><div class="eyebrow">BASE</div><h1>基地</h1></div><div class="nav"><button>出撃準備</button><button>タイトルへ</button><button>設定・操作</button></div></div>
    <div class="wallet"><span>コイン 0</span><span>武装片 0</span><span>育成 0</span></div>
    <div class="cards current hidden">
      <button class="card"><strong>武器</strong><span class="desc">一覧・比較・整理</span><small>3丁を所持</small></button>
      <button class="card"><strong>アクセサリ</strong><span class="desc">作成・装備・合成</span><small>0個を所持</small></button>
      <button class="card"><strong>育成</strong><span class="desc">兵士の能力を強化</span><small>兵士ごとの成長を管理</small></button>
      <button class="card" disabled><strong>工房</strong><span class="desc">工事中</span><small>武器のグレードアップ施設を準備中</small></button>
    </div>
    <div class="cards proposal">
      <button class="card"><strong>武器</strong><span class="desc">一覧・比較・整理</span><small>3丁を所持 · 整理待ち 0丁</small><span class="end">›</span></button>
      <button class="card"><strong>アクセサリ</strong><span class="desc">作成・装備・合成</span><small>0個を所持</small><span class="end">›</span></button>
      <button class="card"><strong>育成</strong><span class="desc">兵士の能力を強化</span><small>現在の状態を一行で表示</small><span class="end">›</span></button>
      <button class="card" disabled><strong>工房</strong><span class="desc">工事中</span><small>武器のグレードアップ施設を準備中</small></button>
    </div>
  </div>
  <div class="item-preview">
    <h2>基地の各項目も整える</h2>
    <p class="note">機能と画面構造を変えず、各項目で優先して見せる情報の例です。実際の武器名・性能・資源額ではありません。</p>
    <div class="item-tabs" role="tablist" aria-label="基地の項目"><button role="tab" aria-selected="true" data-item="weapon">武器</button><button role="tab" aria-selected="false" data-item="accessory">アクセサリ</button><button role="tab" aria-selected="false" data-item="growth">育成</button></div>
    <div class="item-panel" id="item-panel" role="tabpanel"></div>
  </div>
  <div class="flow">
    <h2>初回導入の順序</h2>
    <div class="steps" id="steps"></div>
    <div class="flow-detail" id="detail" aria-live="polite"></div>
    <p class="fine">各案内は途中スキップ可能。戦闘中の説明時はソロの敵・弾・時計を止め、報酬とミッション判定を変えません。</p>
  </div>
</div>
<script>
const sections=[
['1 進撃を選ぶ','タイトルの「ソロ：進撃 または 生存」→作戦選択の「進撃」→出撃準備。通常ST1と装備2枠を見て出撃。生存は別の導入対象。'],
['2 移動・射撃','端末に合わせて移動、照準、射撃を案内。ロードが完了してから開始。'],
['3 回避・切替','安全な機会に回避と武器切替を各1回案内。PCはSpace＝回避、Q＝切替。操作達成は任意で、スキップ可能。'],
['4 戦闘の情報','体力、救急箱、追加目標を短く説明。救急箱の使用は強制しない。'],
['5 報酬','戦果と保存済み報酬の確認場所を示し、既存の受け取り操作へ。'],
['6 基地','武器、アクセサリ、育成の入口を示し、現行の初回案内へ接続。'],
['7 協力','タイトルの協力入口と通信が必要なことを案内。自動参加はしない。']
];
const steps=document.querySelector('#steps'),detail=document.querySelector('#detail');
sections.forEach(([name,body],i)=>{const b=document.createElement('button');b.innerHTML=`<strong>${name}</strong><small>タップして内容を見る</small>`;b.onclick=()=>{[...steps.children].forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','step');detail.textContent=body};steps.append(b)});steps.firstChild.click();
for(const kind of ['current','proposal'])document.querySelector('#'+kind).onclick=()=>{for(const other of ['current','proposal']){document.querySelector('.cards.'+other).classList.toggle('hidden',other!==kind);document.querySelector('#'+other).setAttribute('aria-pressed',String(other===kind))}};
const itemExamples={
 weapon:'<h3>武器：系統選択から既存の1行一覧へ</h3><p>系統カードは名称・所持数・入口を揃える。一覧の性能見出しとロック位置は維持。</p><div class="mini-row"><strong>武器系統</strong><span>所持 3丁</span><em>一覧へ ›</em></div>',
 accessory:'<h3>アクセサリ：作成操作と所持品を読み分ける</h3><p>上部の作成・合成操作と下部の所持品行を区切り、効果と装備状態を先に読めるようにする。</p><div class="mini-row"><strong>R1</strong><span>効果の短い表示 · 装備状態</span><em class="mini-action">装備</em><em class="mini-action">ロック</em></div>',
 growth:'<h3>育成：4能力とポイント残量を見渡す</h3><p>既存レーダーと詳細、下部の確定・キャンセルを保ち、状態の見分けを強める。</p><div class="mini-four"><span>最大HP<b>確定済み</b></span><span>AIM補助<b>編集中</b></span><span>移動速度<b>未解放</b></span><span>武器切替<b>確定済み</b></span></div>'
};
document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-item]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));document.querySelector('#item-panel').innerHTML=itemExamples[b.dataset.item]});document.querySelector('[data-item="weapon"]').click();
</script>
</html>
