<!doctype html><html lang="ja"><meta charset="utf-8"><title>兵士モーション比較・調整中</title>
<style>body{margin:0;background:#141c29;color:#eef3fb;font:16px system-ui}header{position:absolute;z-index:2;left:0;right:0;padding:14px;background:#172233ee;display:flex;gap:12px;align-items:center;flex-wrap:wrap}select,button{font:inherit;color:inherit;background:#283a50;border:1px solid #657a96;padding:9px;border-radius:7px}input{width:170px}#status{font-size:13px}footer{position:absolute;bottom:15px;left:15px;background:#172233dd;padding:12px;max-width:700px;font-size:13px}#labels{position:absolute;top:115px;left:0;right:0;display:flex;justify-content:space-around;pointer-events:none}canvas{display:block}</style>
<header><strong>兵士モーション比較 · 調整中</strong><select id="clip" aria-label="動作"></select><select id="player" aria-label="プレイヤー色"></select><button id="play">一時停止</button><select id="speed" aria-label="速度"><option value="1">通常速度</option><option value="0.5">半分の速度</option></select><button id="front">正面</button><button id="side">側面</button><button id="close">手元を拡大</button><button id="wide">全身比較</button><label>時間 <input id="time" aria-label="時間" type="range" min="0" max="1" step=".001" value="0"></label><span id="status">読込中</span></header>
<div id="labels"><strong>見本 · Quaternius</strong><strong>兵士 · 調整候補</strong></div><footer>足の接地・膝の向き・重心・装備の変形を比較します。銃の構えと射撃・装填は別工程で調整中です。現在の候補は未承認です。</footer>
<script type="importmap">{"imports":{"three":"vendor/three.module.js"}}</script>
<script type="module">
import * as T from 'three';
import {PLAYER_ACCENTS,installPlayerAccent} from './player-accent.js';
import {GLTFLoader} from 'vendor/GLTFLoader.js';
import {OrbitControls} from 'vendor/OrbitControls.js';
const $=id=>document.getElementById(id),scene=new T.Scene();scene.background=new T.Color('#141c29');
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);
renderer.outputColorSpace=T.SRGBColorSpace;const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);camera.position.set(0,1.3,6.2);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.85,0);controls.update();
scene.add(new T.HemisphereLight(0xdceaff,0x525663,2.5));const light=new T.DirectionalLight(0xffffff,3);light.position.set(-3,5,4);scene.add(light);scene.add(new T.GridHelper(10,40,0x6a798c,0x344256));
const names={Idle:'待機',Walk:'歩行',Jog:'小走り',Sprint:'走行',Jump_Start:'跳び始め',Jump_Air:'空中',Jump_Land:'着地',Dodge_Roll:'回避',Hit:'被弾',Down:'倒れる',Revive:'救助姿勢の参考',Rifle_Idle:'ライフル待機',Rifle_LowReady:'銃を下げる',Rifle_Aim:'照準へ構える',Rifle_Fire:'ライフル射撃',Rifle_Reload:'ライフル装填',Rifle_Walk:'ライフル歩行',Rifle_Run:'ライフル走行',Rifle_Backward:'後退',Weapon_Switch:'武器切替',Shotgun_Fire:'散弾銃射撃',Shotgun_Reload:'散弾銃装填',Rocket_Fire:'ロケット射撃',Rocket_Reload:'ロケット装填'};
const loader=new GLTFLoader();let playing=true,time=0,pair=[],active=[],duration=1;
const loops=new Set(['Idle','Walk','Jog','Sprint','Jump_Air','Revive','Rifle_Idle','Rifle_LowReady','Rifle_Walk','Rifle_Run','Rifle_Backward']);
try{
 const [ref,soldier,report,game,...weaponAssets]=await Promise.all([loader.loadAsync('source/ual/Animation%20Library%5BStandard%5D/Godot/AnimationLibrary_Godot_Standard.glb'),loader.loadAsync(new URLSearchParams(location.search).has('grip')?'grip-preview.glb':'soldier-motion-candidate.glb'),fetch('retarget-report.json').then(r=>r.json()),loader.loadAsync('source/game-trooper.glb'),...['rifle','shotgun','rocket'].map(n=>loader.loadAsync('source/'+n+'.glb'))]);
 const setAccent=installPlayerAccent(soldier.scene);PLAYER_ACCENTS.forEach((p,i)=>$('player').add(new Option(p.label,i)));$('player').onchange=()=>setAccent(+$('player').value);ref.scene.traverse(o=>{if(o.name==='Icosphere')o.visible=false});pair=[ref,soldier];pair.forEach((g,i)=>{const group=new T.Group();group.position.x=i?1.05:-1.05;group.rotation.y=0;group.add(g.scene);scene.add(group);g.group=group;g.mixer=new T.AnimationMixer(g.scene);g.scene.traverse(o=>{if(o.isMesh)o.frustumCulled=false});});
 if(new URLSearchParams(location.search).has('grip'))report.clips=report.clips.filter(c=>c.name==='Rifle_Idle');if(new URLSearchParams(location.search).has('grip'))report.clips=report.clips.filter(c=>c.name==='Rifle_Idle');if(new URLSearchParams(location.search).has('grip'))report.clips=report.clips.filter(c=>c.name==='Rifle_Idle');report.clips.forEach(c=>{let option=new Option(names[c.name],c.name);$('clip').add(option)});
 game.group=ref.group;ref.group.add(game.scene);game.scene.rotation.y=Math.PI;game.mixer=new T.AnimationMixer(game.scene);game.scene.visible=false;
 const weapons=[game,soldier].flatMap(g=>weaponAssets.map((asset,index)=>{const w=asset.scene.clone(true),socket=g.scene.getObjectByName('RightHandWeaponSocket');if(socket){socket.add(w);w.rotation.x=Math.PI/2}w.userData.weaponType=['Rifle_','Shotgun_','Rocket_'][index];return w}));
 function choose(){const info=report.clips.find(c=>c.name===$('clip').value);pair[0]=info.source==='game'?game:ref;ref.scene.visible=info.source!=='game';game.scene.visible=info.source==='game';document.querySelector('#labels strong').textContent=info.source==='game'?'比較元 · 既存スワフロ動作':'見本 · Quaternius';weapons.forEach(w=>w.visible=info.name.startsWith(w.userData.weaponType));active=pair.map((g,i)=>{g.mixer.stopAllAction();const clip=g.animations.find(a=>a.name===(i?'Soldier_'+info.name:info.reference))??g.animations.find(a=>a.name===info.name);if(!clip)throw Error('動作がありません: '+info.name+' '+g.animations.map(a=>a.name));let action=g.mixer.clipAction(clip);action.setLoop(T.LoopOnce,1);action.clampWhenFinished=true;action.play();return {action,clip};});time=0;duration=active[1].clip.duration;$('status').textContent=names[info.name]+' · '+duration.toFixed(2)+'秒';}
 $('clip').value=new URLSearchParams(location.search).has('grip')?'Rifle_Idle':'Walk';$('clip').onchange=choose;choose();
 $('close').onclick=()=>{camera.position.set(1.05,1.3,1.7);controls.target.set(1.05,1.15,0);controls.update()};
 $('wide').onclick=()=>{camera.position.set(0,1.3,6.2);controls.target.set(0,.85,0);controls.update()};
 $('play').onclick=()=>{if(time>=duration)time=0;playing=!playing;$('play').textContent=playing?'一時停止':'再生'};
 $('time').oninput=()=>{playing=false;$('play').textContent='再生';time=+$('time').value*duration};
 $('front').onclick=()=>{pair.forEach(g=>g.group.rotation.y=0)};$('side').onclick=()=>{pair.forEach(g=>g.group.rotation.y=Math.PI/2)};
 let last=performance.now();renderer.setAnimationLoop(now=>{const dt=Math.min((now-last)/1000,.1);last=now;if(playing){time+=dt*+$('speed').value;if(time>=duration){if(loops.has($('clip').value))time%=duration;else{time=duration;playing=false;$('play').textContent='再生';}}}pair.forEach((g,i)=>{active[i].action.paused=false;active[i].action.enabled=true;g.mixer.setTime(time/duration*active[i].clip.duration)});$('time').value=time/duration;controls.update();renderer.render(scene,camera)});
}catch(e){$('status').textContent='確認エラー: '+e.message;console.error(e)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></html>
