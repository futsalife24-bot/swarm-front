<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRISM · RAY · FOUNDRY ZERO — Motion Lab</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#102029;color:#e2eeed;font:14px system-ui}canvas{display:block}header{position:fixed;top:18px;left:22px;right:22px;pointer-events:none}small{color:#81b4b7;letter-spacing:.16em;font-size:10px}h1{font-size:25px;margin:5px 0 14px;font-weight:550}nav{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto;max-width:760px}button{background:#162e39dd;color:#c4dbdf;border:1px solid #47616b;border-radius:5px;padding:7px 11px;cursor:pointer}button.active{background:#8ee3d5;color:#10272d;border-color:#8ee3d5}footer{position:fixed;bottom:18px;left:22px;right:22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px;background:#102029e8;border-top:1px solid #3c555b}input{accent-color:#8ee3d5;flex:1;min-width:120px}#note{font-size:12px;color:#a9c2c7}#error{color:#ffc59f} @media(max-height:450px){header{top:9px}h1{font-size:18px;margin:3px 0 6px}button{padding:5px 8px}footer{bottom:7px;padding:6px}}
</style><canvas></canvas><header><small>ADOPTED DESIGN / LOCAL MOTION STUDY 01</small><h1>PRISM</h1><nav id="models"></nav><nav id="clips" style="margin-top:8px"></nav><nav style="margin-top:8px"><button data-view="oblique">斜め</button><button data-view="front">正面</button><button data-view="side">側面</button><button id="rest">採用形状</button><button id="pause">一時停止</button><button id="speed">速度 1×</button></nav><p id="error"></p></header><footer><span id="note"></span><input id="seek" aria-label="再生位置" type="range" min="0" max="4" step=".01" value="0"><span id="time"></span></footer><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const descriptions={prism:['浮遊板の独立安定化','浮遊板のゆらぎを伴う移動','外板展開・コアの反動'],ray:['ヒレと尾の緩やかな遊泳','ヒレの推進・3本の尾の波動','大きく振りかぶり、ヒレを打ち下ろして突進'],foundry_zero:['支持脚を接地させた炉の駆動','6脚の交互支持・足先を水平に保持','前脚を高く上げ、叩き下ろして炉の衝撃波']};
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x102029);
const scene=new T.Scene();scene.add(new T.HemisphereLight(0xe1faff,0x455651,2));const light=new T.DirectionalLight(0xffffff,3);light.position.set(-3,8,-5);scene.add(light);const grid=new T.GridHelper(36,72,0x55777b,0x233c46);scene.add(grid);
const impactRings=Array.from({length:2},(_,i)=>{const mesh=new T.Mesh(new T.RingGeometry(1,1.055,96),new T.MeshBasicMaterial({color:i?0xffcc55:0xff7722,transparent:true,opacity:0,side:T.DoubleSide,depthWrite:false}));mesh.rotation.x=-Math.PI/2;mesh.position.set(0,.045+i*.006,-2.4);mesh.visible=false;scene.add(mesh);return mesh});
function effects(t){for(const [i,ring] of impactRings.entries()){const u=(t-3.1-i*.12)/.95;ring.visible=!rest&&name==='foundry_zero'&&mode==='Attack'&&u>=0&&u<1;if(ring.visible){ring.scale.setScalar(1.2+u*6);ring.material.opacity=(1-u)*.8}}}
const camera=new T.PerspectiveCamera(38,1,.05,200);const controls=new OrbitControls(camera,renderer.domElement);const loader=new GLTFLoader();const assets={};let name='prism',mode='Idle',view='oblique',time=0,playing=true,speed=1,rest=false;
for(const n of Object.keys(descriptions)) {const b=document.createElement('button');b.textContent=n.replace('_',' ').toUpperCase();b.dataset.enemy=n;b.onclick=()=>selectEnemy(n);document.querySelector('#models').append(b)}
for(const [i,n] of ['Idle','Locomotion','Attack'].entries()){const b=document.createElement('button');b.textContent=['待機','移動','攻撃'][i];b.dataset.clip=n;b.onclick=()=>select(n);document.querySelector('#clips').append(b)}
function refresh(){document.querySelector('h1').textContent=name.replace('_',' ').toUpperCase();document.querySelectorAll('[data-enemy]').forEach(b=>b.classList.toggle('active',b.dataset.enemy===name));document.querySelectorAll('[data-clip]').forEach(b=>b.classList.toggle('active',!rest&&b.dataset.clip===mode));document.querySelector('#rest').classList.toggle('active',rest);document.querySelector('#note').textContent=rest?'採用済みの中立形状':descriptions[name][['Idle','Locomotion','Attack'].indexOf(mode)];document.querySelector('#seek').max=assets[name].clips.find(c=>c.name===mode).duration}
function selectEnemy(n){name=n;for(const [key,a] of Object.entries(assets))a.model.visible=key===n;select(mode);setView(view)}
function select(n){mode=n;rest=false;time=0;const a=assets[name];a.mixer.stopAllAction();const action=a.mixer.clipAction(a.clips.find(c=>c.name===n));action.reset().setLoop(T.LoopOnce,1);action.clampWhenFinished=true;action.play();refresh();draw(0)}
function draw(t){time=t;effects(t);const a=assets[name];if(!rest)a.mixer.setTime(t);a.model.updateMatrixWorld(true);a.model.traverse(o=>{if(o.isSkinnedMesh){o.skeleton.update();o.computeBoundingSphere()}});renderer.render(scene,camera);document.querySelector('#seek').value=t;document.querySelector('#time').textContent=t.toFixed(2)+'s'}
function setView(v){view=v;const s=name==='foundry_zero'?2.65:1;controls.target.set(0,1.5*s,0);camera.position.fromArray({oblique:[7*s,5*s,-9*s],front:[0,2.8*s,-12*s],side:[12*s,2.8*s,0]}[v]);controls.update();draw(time)}
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();draw(time)}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.querySelector('#pause').onclick=()=>{playing=!playing;document.querySelector('#pause').textContent=playing?'一時停止':'再生'};document.querySelector('#speed').onclick=()=>{speed=speed===1?.5:1;document.querySelector('#speed').textContent='速度 '+speed+'×'};document.querySelector('#seek').oninput=e=>{playing=false;document.querySelector('#pause').textContent='再生';draw(Number(e.target.value))};document.querySelector('#rest').onclick=()=>{rest=true;assets[name].mixer.stopAllAction();refresh();draw(0)};
try {for(const n of Object.keys(descriptions)){const gltf=await loader.loadAsync('/assets/enemies/'+n+'_motion_v1.glb');assets[n]={model:gltf.scene,clips:gltf.animations,mixer:new T.AnimationMixer(gltf.scene)};scene.add(gltf.scene)}selectEnemy(name);resize();addEventListener('resize',resize);window.enemyMotion={ready:true,assets,renderer,scene,selectEnemy,select,setView,draw,setPlaying:p=>playing=p};const clock=new T.Clock();function tick(){const dt=Math.min(clock.getDelta(),.1);if(playing&&!rest){const duration=assets[name].clips.find(c=>c.name===mode).duration;draw((time+dt*speed)%duration)}else renderer.render(scene,camera);requestAnimationFrame(tick)}tick()}catch(e){document.querySelector('#error').textContent='読込に失敗しました: '+e.message;throw e}
</script></html>
