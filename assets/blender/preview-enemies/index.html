<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enemy phase 1 local comparison</title><link rel="icon" href="data:,"><style>body{margin:0;background:#14212b;color:#d6e7e9;font:14px system-ui}canvas{display:block}nav{position:fixed;top:12px;left:16px;display:flex;gap:7px;flex-wrap:wrap}button,select{background:#233b47;color:#d6e7e9;border:1px solid #69818b;padding:7px}footer{position:fixed;bottom:12px;left:16px;font-size:12px}</style><canvas></canvas><nav><strong id="title"></strong><button data-model="new">GLB v1</button><button data-model="current">Current</button><button data-model="compare">Current / GLB</button><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="oblique">Oblique</button><button data-view="gameview">Game camera</button><button id="mono">Silhouette</button></nav><footer>LOCAL STATIC PROTOTYPE · GLB left / Current right · metres · forward −Z · drag to orbit</footer><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {enemyGeometry,mechanizeMaterial} from '/src/client/enemy-model.ts';
const enemy=new URLSearchParams(location.search).get('enemy')||'prism';const kind={prism:'spitter',ray:'hornet',foundry_zero:'boss'}[enemy];if(!kind)throw Error('Unknown prototype');document.querySelector('#title').textContent=enemy.toUpperCase()+' / v1';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x14212b);const scene=new T.Scene();scene.add(new T.HemisphereLight(0xdff3ff,0x49524a,2));const light=new T.DirectionalLight(0xffffff,2.7);light.position.set(-3,7,-4);scene.add(light);
const boss=kind==='boss',unit=boss?2.6:1;const grid=new T.GridHelper(18*unit,36,0x55727a,0x293e49);scene.add(grid);
const model=(await new GLTFLoader().loadAsync('/assets/enemies/'+enemy+'_v1.glb')).scene;scene.add(model);const current=new T.Mesh(enemyGeometry(kind),mechanizeMaterial(new T.MeshStandardMaterial({vertexColors:true})));scene.add(current);current.visible=false;
const saved=new Map();model.traverse(o=>{if(o.isMesh)saved.set(o,o.material)});saved.set(current,current.material);const flat=new T.MeshBasicMaterial({color:0xd9e6e4});let camera,controls,view='oblique',silhouette=false,mode='new';
function render(){renderer.render(scene,camera)}
function setView(name){view=name;controls?.dispose();const aspect=innerWidth/innerHeight,h=(mode==='compare'?6.7:4.5)*unit;const target=new T.Vector3(0,1.45*unit,0);
 if(name==='gameview'){camera=new T.PerspectiveCamera(65,aspect,.1,200);camera.position.set(.8,2.9,-(boss?18:9));camera.lookAt(0,1.5,20)}else{camera=new T.OrthographicCamera(-h*aspect/2,h*aspect/2,h/2,-h/2,.01,160);camera.position.fromArray({front:[0,target.y,-12*unit],side:[12*unit,target.y,0],oblique:[6*unit,4.5*unit,-8*unit]}[name]);camera.lookAt(target)}controls=new OrbitControls(camera,renderer.domElement);controls.target.copy(name==='gameview'?new T.Vector3(0,1.5,20):target);controls.update();controls.addEventListener('change',render);render()}
function select(name){mode=name;model.visible=name!=='current';current.visible=name!=='new';model.position.x=name==='compare'?2.2*unit:0;current.position.x=name==='compare'?-2.2*unit:0;setView(view)}
function mono(active){silhouette=active;for(const[o,m]of saved)o.material=active?flat:m;render()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>select(b.dataset.model));document.querySelector('#mono').onclick=()=>mono(!silhouette);addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);setView(view)});setView('oblique');window.enemyPreview={model,current,renderer,scene,setView,select,mono,render,ready:true};
</script></html>
