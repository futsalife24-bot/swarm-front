<!doctype html><meta charset="utf-8"><title>走りから構えへの移行</title>
<style>body{margin:0;background:#263238;color:white;font:18px system-ui}#label{padding:12px}canvas{display:block}</style><div id="label">読込中</div>
<script type="module">
import * as T from 'three';
import {StandardTrooper,loadStandardTrooper} from '/src/client/standard-trooper.ts';
import {createWorld,addPlayer,start} from '/src/shared/game.ts';
import {STARTERS} from '/src/shared/defs.ts';
const assets=await loadStandardTrooper(),t=new StandardTrooper(assets);
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1000,700);renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#263238');scene.add(t.model,new T.HemisphereLight(0xe7f2ff,0x4b4540,2));const light=new T.DirectionalLight(0xffffff,3);light.position.set(-3,5,-4);scene.add(light);
scene.add(new T.GridHelper(20,40,0x78847a,0x4c5a55));
const camera=new T.PerspectiveCamera(35,1000/700,.01,100);camera.position.set(3.3,2,-4.8);camera.lookAt(0,.85,0);
let p,clock=0,run=0,dx=0,dz=-1;
const footVertices=[];t.model.traverse(o=>{if(!o.isSkinnedMesh)return;const ix=o.geometry.attributes.skinIndex,w=o.geometry.attributes.skinWeight;for(let j=0;j<ix.count;j++)for(let k=0;k<4;k++){const b=o.skeleton.bones[ix.getComponent(j,k)].name;if(w.getComponent(j,k)>.5&&/^(Foot|Toe)_/.test(b)){footVertices.push([o,j,b.slice(-1)]);break}}});
function measure(){const v=new T.Vector3(),sole={L:Infinity,R:Infinity};t.model.traverse(o=>{if(o.isSkinnedMesh)o.skeleton.update()});for(const [o,j,s] of footVertices){o.getVertexPosition(j,v).applyMatrix4(o.matrixWorld);sole[s]=Math.min(sole[s],v.y)}const feet=['L','R'].map(s=>t.model.getObjectByName('Foot_'+s).getWorldPosition(new T.Vector3()).toArray());return {sole,feet,mode:t.mode,lowerBlend:t.lowerBlend,finite:t.bones.every(b=>b.matrixWorld.elements.every(Number.isFinite))};}
function reset(kind='rifle',direction=[0,-1]){const w=createWorld('stop-'+(++run));p=addPlayer(w,'p',[STARTERS.find(w=>w.kind===kind),STARTERS[0]]);start(w);p.x=p.z=0;clock=0;[dx,dz]=direction;t.update(p,0,clock,w.run,1/60);window.runId=w.run;return measure()}
function tick(moving,dt=1/60){clock+=dt;if(moving){p.x+=dx*7*dt;p.z+=dz*7*dt}t.update(p,0,clock,window.runId,dt);document.querySelector('#label').textContent=`${moving?'走り':'停止 → 構え'} ${(clock).toFixed(2)}秒`;return measure()}
window.qa={reset,tick,measure,t,p:()=>p,view(side){camera.position.set(...(side?[4.8,1.3,0]:[0,1.5,-5.2]));camera.lookAt(0,.85,0);renderer.render(scene,camera)}};reset();tick(false);window.ready=true;
</script>
