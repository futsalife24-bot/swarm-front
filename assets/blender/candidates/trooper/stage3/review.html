<!doctype html><meta charset="utf-8"><title>Swarm Front motion review</title>
<style>body{margin:16px;background:#222b30;color:white;font:14px system-ui}video{width:min(720px,95vw);display:block;background:#111;margin:8px 0}button,select,input{font:inherit;margin:3px;padding:5px}a{color:#8df}label{display:inline-block}h1{font-size:22px}</style>
<h1>兵士・切替のローカル確認</h1><p>通常速度は0.5秒。末尾の静止時間と反復は確認用です。ファイル名がtestの動画は出力経路の試験で、監査提出版ではありません。</p>
<select id="file"><option>test_1_to_2_normal.mp4</option><option>P3_1_to_2_normal.mp4</option><option>P3_1_to_2_slow25.mp4</option><option>P3_2_to_1_normal.mp4</option><option>P3_2_to_1_slow25.mp4</option></select><button id="load">動画を開く</button>
<video id="video" controls loop preload="auto" src="test_1_to_2_normal.mp4"></video>
<button id="play">再生</button><button id="pause">一時停止</button><button id="back">1フレーム戻る</button><button id="next">1フレーム進む</button><label>速度 <select id="speed"><option value="1">1倍</option><option value="0.25">0.25倍</option></select></label><p id="status"></p>
<script>const v=document.querySelector('#video'),status=document.querySelector('#status');document.querySelector('#load').onclick=()=>{v.src=document.querySelector('#file').value;v.load()};document.querySelector('#play').onclick=()=>v.play();document.querySelector('#pause').onclick=()=>v.pause();document.querySelector('#back').onclick=()=>{v.pause();v.currentTime=Math.max(0,v.currentTime-1/120)};document.querySelector('#next').onclick=()=>{v.pause();v.currentTime+=1/120};document.querySelector('#speed').onchange=e=>v.playbackRate=+e.target.value;v.ontimeupdate=()=>status.textContent=`時刻 ${v.currentTime.toFixed(3)} / ${v.duration.toFixed(3)} 秒 | ${v.paused?'停止':'再生中'}`;v.onerror=()=>status.textContent='動画ファイルをまだ読み込めません';</script>
