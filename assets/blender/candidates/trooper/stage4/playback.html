<!doctype html><meta charset="utf-8"><title>通常速度・保存動画確認</title><style>body{background:#182128;color:white;font:16px system-ui}video{width:960px}button{padding:9px;margin:4px}</style><video id="v" src="normal-speed-showcase.mp4" controls></video><button onclick="v.play()">再生</button><button onclick="v.pause()">停止</button><div id="buttons"></div><p id="state"></p><script>const v=document.querySelector('video');for(const t of [0,3,8,12,16,20,24,27,30]){let b=document.createElement('button');b.textContent=t+'秒';b.onclick=()=>{v.currentTime=t;v.pause()};buttons.append(b)}v.ontimeupdate=()=>state.textContent=v.currentTime+' / '+v.duration;</script>
