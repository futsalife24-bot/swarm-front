<!doctype html><meta charset="utf-8"><title>実ゲームエンジン・兵士結合確認</title><style>body{margin:0;background:#19242c;color:white;font:14px system-ui}#panel{position:absolute;z-index:3;top:8px;left:8px;background:#17222de8;padding:10px;max-width:600px}button{padding:8px}pre{white-space:pre-wrap;max-height:260px;overflow:auto}#damage{position:absolute;inset:0;pointer-events:none}</style><canvas id="world" aria-label="実ゲーム描画"></canvas><div id="damage"></div><div id="panel"><button id="start">実エンジンの代表操作を確認</button><pre id="report">読込中</pre></div>
<script type="module">
import {Renderer} from '/src/client/render.ts';import {createWorld,addPlayer,start,step,neutral,spawn} from '/src/shared/game.ts';import {STARTERS} from '/src/shared/defs.ts';import {loadStandardTrooper} from '/src/client/standard-trooper.ts';
await loadStandardTrooper();const renderer=new Renderer(document.querySelector('#world'));renderer.resize();let w,p,elapsed=0,acc=0,running=false,done=new Set(),result;
function fixture(run){w=createWorld(run,42,1);p=addPlayer(w,'qa',[STARTERS[2],STARTERS[0]]);start(w);p.x=0;p.z=0;w.enemies=[];w.nextSpawn=1e9;spawn(w,'boss',0,-30,'crown');Object.assign(w.enemies[0],{active:false,cool:100});}
fixture('engine-ready');const report=document.querySelector('#report');report.textContent='準備完了。実際のゲームのstepとRendererを使う隔離fixtureです。';
const once=(key,fn)=>{if(!done.has(key)){done.add(key);fn()}};
document.querySelector('#start').onclick=()=>{fixture('engine-'+Date.now());elapsed=acc=0;done.clear();running=true;result={passed:false,source:'actual authoritative step + actual Renderer + adopted StandardTrooper; isolated fixture, not manual input',modes:[],samples:[],errors:[],reverseLoadout:['rocket','rifle'],heavyTriggered:false,restarted:false};};
function snapshot(label){const t=renderer.players.get('qa')?.userData.trooper;result.samples.push({label,time:w.time,position:[p.x,p.z],ammo:[...p.ammo],slot:p.slot,reload:p.reload,heavy:p.heavyHit??0,mode:t?.mode,weapons:t?.weapons.map(o=>o.parent?.name)});}
let last=performance.now();function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(running){elapsed+=dt;acc+=dt;while(acc>=.05){acc-=.05;const input=neutral();if(elapsed>=1&&elapsed<2)input.mz=1;if((elapsed>=2&&elapsed<3)||(elapsed>=4&&elapsed<5))input.fire=true;if(elapsed>=3)once('swap1',()=>input.swap=true);if(elapsed>=5)once('reload',()=>input.reload=true);if(elapsed>=7.2)once('swap2',()=>input.swap=true);if(elapsed>=7.4)once('heavy',()=>{const e=w.enemies[0];Object.assign(e,{x:p.x,z:p.z-10,wind:.01,tx:p.x,tz:p.z,active:true,cool:100});});if(elapsed>=9)once('dodge',()=>{input.dodge=true;input.mx=1});step(w,{qa:input},.05);if((p.heavyHit??0)>0)result.heavyTriggered=true;}if(elapsed>=11)once('restart',()=>{snapshot('before restart');fixture('engine-restart-'+Date.now());result.restarted=true});}
renderer.render(w,'qa',dt,0,0,undefined,running);const t=renderer.players.get('qa')?.userData.trooper;
if(running&&t){if(!result.modes.includes(t.mode))result.modes.push(t.mode);if(t.bones.some(b=>!b.matrixWorld.elements.every(Number.isFinite)))result.errors.push('nonfinite');for(const [sec,label] of [[1,'idle'],[2,'moved'],[3,'rocket fired'],[4,'switched rifle'],[5,'rifle fired'],[5.8,'reloading'],[8,'switch and heavy'],[10,'recovered'],[12,'restarted']])if(elapsed>=sec)once(label,()=>snapshot(label));report.textContent=JSON.stringify({time:elapsed.toFixed(1),mode:t.mode,hp:p.hp,ammo:p.ammo,slot:p.slot,heavy:result.heavyTriggered},null,2);if(elapsed>=12.5){running=false;const a=result.samples.find(x=>x.label==='rocket fired'),b=result.samples.find(x=>x.label==='rifle fired'),move=result.samples.find(x=>x.label==='moved');result.passed=result.errors.length===0&&a.ammo[0]<2&&b.ammo[1]<32&&move.position[1]<0&&result.heavyTriggered&&result.restarted&&t.weapons.length===2&&result.modes.includes('switch_heavy')&&result.modes.some(x=>x.includes('reload'))&&t.mode.startsWith('normal_');result.drawCalls=renderer.drawCalls;report.textContent=JSON.stringify(result,null,2);}}
requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script>
