<!doctype html><html lang="ja"><meta charset="utf-8"><title>Swarm Front — 兵士 最終試作</title>
<style>body{margin:0;background:#151d23;color:#e8eef2;font:14px system-ui}header{padding:14px 20px;display:flex;gap:20px;align-items:center}h1{font-size:20px;margin:0}button,select{background:#344651;color:white;border:1px solid #60737d;border-radius:5px;padding:8px;cursor:pointer}main{display:flex;gap:16px;padding:0 16px}canvas{width:min(76vw,960px);height:auto;display:block}aside{width:250px}#actions{display:flex;flex-wrap:wrap;gap:5px}#actions button{font-size:12px;padding:6px}p{line-height:1.6}.muted{color:#a5b9c4}#status{white-space:pre-wrap;line-height:1.6}footer{padding:12px 20px}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<header><h1>Swarm Front / 兵士試作</h1><button id="showcase">通常速度で全動作を確認・録画</button><button id="pause">一時停止</button><button id="front">正面</button><button id="back">背面</button><button id="capture">画像保存</button></header>
<main><div><canvas id="view"></canvas><p id="caption">読込中…</p></div><aside><p class="muted">隔離されたローカル検証用。ドラッグで回転、ホイールで拡大。右下はゲーム表示を想定した縮小表示です。</p><div id="actions"></div><p id="status"></p></aside></main><footer>微細な中割りの干渉は許容。武器はソケットへ接続し、持ち替えは0.5秒・格納45%／取り出し60%で再現。</footer>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const canvas=document.querySelector('#view'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setSize(960,600);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
const scene=new THREE.Scene();scene.background=new THREE.Color('#293740');const camera=new THREE.PerspectiveCamera(35,960/600,.01,100);camera.position.set(2.8,2.1,-4.1);const controls=new OrbitControls(camera,canvas);controls.target.set(0,.95,0);controls.update();
scene.add(new THREE.HemisphereLight(0xd4eaff,0x6a625a,2.4));const key=new THREE.DirectionalLight(0xffffff,3.6);key.position.set(-3,5,-4);scene.add(key);const rim=new THREE.DirectionalLight(0xaacddd,2);rim.position.set(3,3,3);scene.add(rim);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0x34454d,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.001;scene.add(floor);scene.add(new THREE.GridHelper(10,40,0x718b94,0x465d68));
const insetCamera=new THREE.PerspectiveCamera(38,1,.01,100);insetCamera.position.set(2.8,3,-4.2);insetCamera.lookAt(0,.9,0);
const loader=new GLTFLoader(),manifest=await fetch('motion-manifest.json').then(r=>r.json());const model=await loader.loadAsync('trooper_stage4_candidate.glb');scene.add(model.scene);const mixer=new THREE.AnimationMixer(model.scene);const actions=Object.fromEntries(model.animations.map(c=>[c.name,mixer.clipAction(c)]));
const bones={};model.scene.traverse(o=>{if(o.isBone)bones[o.name]=o});const weapons={};for(const k of ['rifle','shotgun','rocket']){const g=await loader.loadAsync('standard_'+k+'_v4.glb');weapons[k]=g.scene;g.scene.rotation.x=Math.PI/2;g.scene.name='PreviewWeapon_'+k;}
let active=null,current=null,elapsed=0,paused=false,sequence=null,sequenceIndex=0,seqElapsed=0,recording=null,frames=0,fpsSum=0,last=performance.now(),maxFrame=0,sampleTimes=[],samples=[];
const caption=document.querySelector('#caption'),status=document.querySelector('#status');
function attach(kind,bone,visible=true){const o=weapons[kind];o.visible=visible;if(!visible)return;if(o.parent!==bones[bone]){bones[bone].add(o);o.position.set(0,0,0);o.rotation.set(Math.PI/2,0,0);o.scale.setScalar(1)}}
function equipment(){if(!current)return;const sw=current.name.includes('Switch');let held=current.weapon;let t=elapsed/.5;if(sw){const source=current.name.endsWith('1_to_2')?'rifle':'rocket',dest=source==='rifle'?'rocket':'rifle';held=t<.45?source:t>=.60?dest:null;for(const k of ['rifle','rocket'])attach(k,k===held?'RightHandWeaponSocket':k==='rifle'?'BackWeaponSocket':'BackWeaponSocket_2');attach('shotgun','RightHandWeaponSocket',false);}else{attach(held,'RightHandWeaponSocket');for(const k of ['rifle','shotgun','rocket'])if(k!==held)attach(k,k==='rocket'?'BackWeaponSocket_2':'BackWeaponSocket',held==='rocket'?k==='rifle':k==='rocket');}}
function play(name,blend=true){const entry=manifest.clips.find(x=>x.name===name);if(!entry)return;const next=actions[name];if(active&&active!==next){if(blend)active.fadeOut(.08);else active.stop();}next.reset().setEffectiveWeight(1).setEffectiveTimeScale(entry.runtimeDuration?entry.duration/entry.runtimeDuration:entry.name.includes('Dodge')?entry.duration/.32:1);next.setLoop(entry.loop?THREE.LoopRepeat:THREE.LoopOnce,entry.loop?Infinity:1);next.clampWhenFinished=true;if(blend)next.fadeIn(.08);next.play();active=next;current=entry;elapsed=0;caption.textContent=entry.name+' / 通常速度';equipment();}
for(const e of manifest.clips){const b=document.createElement('button');b.textContent=e.name.replace('Trial_','');b.onclick=()=>{sequence=null;play(e.name)};document.querySelector('#actions').append(b)}
const ordered=['Trial_Weapon_Idle_Rifle','Trial_Run','Trial_Run_Backward','Trial_Fire_Rifle','Trial_Reload_Rifle','Trial_Switch_1_to_2','Trial_Weapon_Idle_Rocket','Trial_Run_Rocket','Trial_Run_Backward_Rocket','Trial_Fire_Rocket','Trial_Reload_Rocket','Trial_Switch_2_to_1','Trial_Dodge_Roll','Trial_Hit_Heavy','Trial_Weapon_Idle_Shotgun','Trial_Fire_Shotgun','Trial_Reload_Shotgun','Trial_Idle'];
function view(back){camera.position.set(back?-2.8:2.8,2.1,back?4.1:-4.1);controls.target.set(0,.95,0);controls.update()}
document.querySelector('#front').onclick=()=>view(false);document.querySelector('#back').onclick=()=>view(true);document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'再生':'一時停止'};
async function postImage(path){const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));await fetch(path,{method:'POST',body:blob})}
document.querySelector('#capture').onclick=async()=>{await postImage(camera.position.z<0?'/front':'/back');caption.textContent+=' / PNG保存済み'};
document.querySelector('#showcase').onclick=()=>{if(recording)return;view(false);sequence=ordered;sequenceIndex=0;seqElapsed=0;sampleTimes=[];samples=[];frames=0;fpsSum=0;maxFrame=0;paused=false;play(sequence[0],false);const chunks=[];const mime=['video/webm;codecs=vp8','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));recording=new MediaRecorder(canvas.captureStream(30),{mimeType:mime,videoBitsPerSecond:5000000});recording.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recording.onstop=async()=>{await fetch('/recording',{method:'POST',body:new Blob(chunks,{type:mime})});recording=null;caption.textContent='通常速度の全動作動画を保存しました';};recording.start();};
async function finish(){sequence=null;if(recording)recording.stop();const report={environment:navigator.userAgent,three:THREE.REVISION,clipCount:model.animations.length,bones:Object.keys(bones).length,averageFPS:fpsSum/Math.max(1,frames),maximumFrameMilliseconds:maxFrame,samples,drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles,checked:'All listed clips loaded and played at runtime speed in an isolated Three.js preview; sockets used for weapon attachment. Normal crossfade 80ms, roll instant.',limitations:['No full game network, gameplay collision or arbitrary reversed loadout validation.','Transient intersections are allowed per user criterion.']};await fetch('/validation',{method:'POST',body:JSON.stringify(report,null,2)});play('Trial_Weapon_Idle_Rifle');view(false);}
function animate(now){requestAnimationFrame(animate);const raw=(now-last)/1000;last=now;const dt=Math.min(raw,.1);if(!paused){mixer.update(dt);elapsed+=dt;if(sequence){seqElapsed+=dt;frames++;fpsSum+=1/Math.max(raw,.0001);maxFrame=Math.max(maxFrame,raw*1000);const duration=current.runtimeDuration??(current.name.includes('Dodge')?.32:current.duration);const show=current.loop?2.1:Math.max(.8,duration+.25);if(!sampleTimes.includes(sequenceIndex)&&seqElapsed>Math.min(show*.5,.4)){model.scene.updateMatrixWorld(true);const positions=Object.fromEntries(['Head','Hand_R','Hand_L','RightHandWeaponSocket','BackWeaponSocket','BackWeaponSocket_2'].map(n=>[n,bones[n].getWorldPosition(new THREE.Vector3()).toArray()]));samples.push({clip:current.name,at:elapsed,positions,finite:Object.values(positions).flat().every(Number.isFinite)});sampleTimes.push(sequenceIndex)}if(seqElapsed>=show){sequenceIndex++;seqElapsed=0;if(sequenceIndex>=sequence.length)finish();else{if(sequenceIndex===5||sequenceIndex===11)view(true);if(sequenceIndex===6||sequenceIndex===12)view(false);play(sequence[sequenceIndex],!sequence[sequenceIndex].includes('Dodge'));}}}}equipment();renderer.setScissorTest(false);renderer.setViewport(0,0,960,600);renderer.render(scene,camera);renderer.setScissorTest(true);renderer.setScissor(760,0,200,200);renderer.setViewport(760,0,200,200);renderer.render(scene,insetCamera);renderer.setScissorTest(false);status.textContent=`18試作クリップ / 57骨\n${current?.name??''}\n時刻 ${elapsed.toFixed(2)}秒\n${(1/Math.max(raw,.001)).toFixed(0)} FPS\n${sequence?'全動作確認 '+(sequenceIndex+1)+' / '+sequence.length:'手動操作可'}\n${recording?'録画中':''}`;}
play('Trial_Weapon_Idle_Rifle',false);requestAnimationFrame(animate);
</script></html>
