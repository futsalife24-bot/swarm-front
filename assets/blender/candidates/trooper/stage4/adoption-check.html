<!doctype html><meta charset="utf-8"><title>兵士・本体接続検証</title><style>body{background:#19242c;color:white;font:14px system-ui}canvas{width:960px}button{padding:10px}pre{white-space:pre-wrap}</style><h2>本体のStandardTrooperクラス・4隊員</h2><button id="check">本体接続を検証</button><button id="switch">往復持ち替え</button><button id="reload">装填</button><div id="screen"></div><pre id="report">読み込み中</pre>
<script type="module">
import * as T from 'three';import {StandardTrooper,loadStandardTrooper,TROOPER_SWITCH,TROOPER_SKINS} from '/src/client/standard-trooper.ts';import {createWorld,addPlayer} from '/src/shared/game.ts';import {STARTERS,reloadDuration} from '/src/shared/defs.ts';
const assets=await loadStandardTrooper(),scene=new T.Scene();scene.background=new T.Color('#293740');const camera=new T.PerspectiveCamera(38,960/540,.01,100);camera.position.set(4,3.1,-7.5);camera.lookAt(0,1,0);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(960,540);renderer.setPixelRatio(1);document.querySelector('#screen').append(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x4c5960,3));const key=new T.DirectionalLight(0xffffff,3);key.position.set(-3,5,-4);scene.add(key);scene.add(new T.GridHelper(20,40));
const squad=Array.from({length:4},()=>new StandardTrooper(assets));squad.forEach((t,i)=>{scene.add(t.model);t.model.position.x=(i-1.5)*1.4;t.setSkin(Object.keys(TROOPER_SKINS)[i])});const world=createWorld('adoption-check');const players=squad.map((t,i)=>addPlayer(world,'qa'+i,[STARTERS[i%3],STARTERS[(i+1)%3]]));let tm=0,playing=true,direction=0,manual='idle';
function finite(t){return t.bones.every(b=>b.matrixWorld.elements.every(Number.isFinite))}
function assert(ok,label){if(!ok)throw Error(label)}
document.querySelector('#switch').onclick=()=>{manual='switch';tm=0;direction=1-direction};document.querySelector('#reload').onclick=()=>{manual='reload';tm=0};
let last=performance.now();function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;tm+=dt;if(playing){squad.forEach((t,i)=>{t.equip(players[i].weapons,manual==='switch'?direction:0);if(manual==='switch'){t.sampleSwitch(direction,Math.min(.5,tm));if(tm>1.5)manual='idle'}else{const k=players[i].weapons[0].kind,p=k[0].toUpperCase()+k.slice(1);const n=manual==='reload'?'Reload_'+p:'Weapon_Idle_'+p;t.sample(n,tm%t.clips.get(n).duration)}})}renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
document.querySelector('#report').textContent='準備完了 / '+assets.character.animations.length+' clips';
document.querySelector('#check').onclick=()=>{playing=false;const report={passed:false,source:'actual StandardTrooper class and shipped GLB',clipCount:assets.character.animations.length,bones:squad[0].bones.length,loadoutPairs:0,switchSamples:0,reloadProfiles:[],layeredStates:[],skeletonsIndependent:false,materialsIndependent:false,finite:true};try{
 assert(report.clipCount===18,'18 clips');assert(report.bones===57,'57 bones');assert(squad[0].clips.has('Reload_Rifle'),'reload alias');
 report.skeletonsIndependent=squad.every((a,i)=>squad.every((b,j)=>i===j||a.bones[0]!==b.bones[0]));assert(report.skeletonsIndependent,'shared bones');
 const mats=squad.map(t=>{const set=new Set();t.model.traverse(o=>{if(o.isSkinnedMesh)for(const m of Array.isArray(o.material)?o.material:[o.material])set.add(m)});return set});report.materialsIndependent=mats.every((a,i)=>mats.every((b,j)=>i===j||![...a].some(x=>b.has(x))));assert(report.materialsIndependent,'shared materials');
 const t=squad[0];for(const a of STARTERS)for(const b of STARTERS){const ws=[{...a,id:'a-'+a.kind},{...b,id:'b-'+b.kind}];t.equip(ws,0);for(const from of [0,1])for(let f=0;f<=20;f++){const sec=f*.025;t.sampleSwitch(from,sec);assert(finite(t),'nonfinite switch');const expected=[0,1].map(i=>i===from?(sec<TROOPER_SWITCH.holster?t.hand:t.back[i]):(sec<TROOPER_SWITCH.draw?t.back[i]:t.hand));assert(t.weapons.every((w,i)=>w.parent===expected[i]),'socket attachment');report.switchSamples++}report.loadoutPairs++}
 for(const w of STARTERS){const fixture=createWorld('reload-'+w.kind),p=addPlayer(fixture,'test',[w,STARTERS[0]]);p.x=p.z=0;p.ammo[0]=0;t.update(p,0,0,fixture.run,1/60);p.reload=reloadDuration(w,0)*.65;t.update(p,0,.1,fixture.run,1/60);assert(t['mode'].includes('reload'),'reload mode '+w.kind);assert(finite(t),'reload finite');report.reloadProfiles.push(w.kind)}
 const fixture=createWorld('layers'),p=addPlayer(fixture,'layers',[STARTERS[0],STARTERS[2]]);p.x=p.z=0;t.update(p,0,0,fixture.run,1/60);p.slot=1;p.swapCd=.28;p.heavyHit=.9;t.update(p,0,.2,fixture.run,1/60);assert(finite(t),'switch heavy');report.layeredStates.push(t['mode']);p.heavyHit=0;p.swapCd=.2;p.x=.1;t.update(p,0,.3,fixture.run,1/60);assert(finite(t),'moving switch');report.layeredStates.push(t['mode']);p.evade=.16;t.update(p,0,.4,fixture.run,1/60);assert(finite(t),'roll');report.layeredStates.push(t['mode']);
 report.passed=true;report.note='Finite poses and attachment ownership checked for all nine type pairs; no claim of zero transient intersection.';
 }catch(e){report.error=String(e)}document.querySelector('#report').textContent=JSON.stringify(report,null,2);playing=true;manual='idle';};
</script>
