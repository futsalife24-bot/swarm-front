<canvas></canvas><header><small>SWARM FRONT / MECHANICAL ANOMALY</small><h1>FOUNDRY ZERO</h1><p>頭部 × 1 ＋ 胴体 × 7<br>可動レーザー器官・節の接続部・独立した多関節脚</p></header><div class="badge">統合初版 / 接地・屈曲確認</div><div id="status">読込中…</div><nav><button id="neutral" class="active">中立姿勢</button><button id="flex">屈曲プレビュー</button><button id="pause">一時停止</button><select id="view"><option value="oblique">斜め</option><option value="side">側面</option><option value="front">正面</option><option value="rear">背面</option><option value="top">上面</option><option value="head">頭部詳細</option><option value="body">胴体詳細</option><option value="game">ゲーム距離</option></select><button id="split">分離構造</button><button id="mono">単色輪郭</button><input id="seek" type="range" aria-label="屈曲プレビューの再生位置" min="0" max="4" step="0.016667" value="0"></nav><footer><span>ドラッグで回転 / ホイールで拡大 · 屈曲は構造確認用</span><span id="metrics"></span></footer>
