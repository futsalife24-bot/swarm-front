<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLEAT — ANOMALY candidate 01</title><link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;background:#101918;color:#e8eadc;font:14px system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh;touch-action:none}header{position:fixed;left:30px;top:24px;right:30px;pointer-events:none}small{font-size:10px;letter-spacing:.24em;color:#9ba89b}h1{font-size:34px;letter-spacing:.13em;margin:7px 0 3px;font-weight:500}header p{margin:0;color:#a8b2a4;font-size:12px;line-height:1.7}.badge{position:fixed;right:30px;top:30px;border:1px solid #536c60;padding:8px 12px;font-size:11px;color:#a6c9b5;letter-spacing:.1em}nav{position:fixed;bottom:50px;left:30px;right:30px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}button,select{background:#192722e8;color:#e9eadc;border:1px solid #53645a;border-radius:4px;padding:8px 10px;font:12px system-ui;cursor:pointer}button.active{background:#cbd7b5;color:#18271e;border-color:#cbd7b5}footer{position:fixed;left:30px;right:30px;bottom:18px;display:flex;justify-content:space-between;color:#95a594;font-size:11px}#phase{position:fixed;left:30px;top:150px;font-size:12px;color:#bbd3af}#seek{width:160px;accent-color:#b6d2b7}.labels{position:fixed;left:22%;right:22%;top:130px;display:none;justify-content:space-between;color:#b9c7b9;font-size:12px;pointer-events:none}@media(max-height:500px){header{top:12px;left:15px}h1{font-size:24px;margin:3px 0}header p{display:none}.badge{top:14px;right:15px;padding:6px}#phase{top:83px;left:15px}nav{bottom:36px;left:12px;right:12px;gap:4px}button,select{font-size:10px;padding:5px 7px}footer{bottom:10px;left:15px;right:15px;font-size:9px}.labels{top:82px}}
</style>
<canvas></canvas><header><small>SWARM FRONT / FIELD OBSERVATION 01</small><h1>PLEAT</h1><p>プリート ─ 襞走体<br>獣の背を思わせる被覆。その下で、走行の構造が折り畳まれる。</p></header><div class="badge">基準モデル候補 · 見た目未承認</div><div id="phase">読込中</div><div class="labels"><span>現行 HOUND</span><span>候補 PLEAT</span></div>
<nav><button data-clip="Idle">待機</button><button data-clip="Locomotion">追跡</button><button data-clip="Lunge">溜め・衝撃</button><button id="sequence">一連の動作</button><button id="pause">一時停止</button><select id="view"><option value="oblique">斜め</option><option value="front">正面</option><option value="side">側面</option><option value="rear">背面</option><option value="game">ゲーム距離</option></select><select id="count"><option value="1">1体</option><option value="10">10体</option><option value="40">40体</option></select><select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option></select><button id="compare">現行と比較</button><button id="mono">単色輪郭</button><input id="seek" aria-label="再生位置" type="range" min="0" max="4" step="0.0166667" value="0"></nav>
<footer><span>ドラッグで回転 · ホイール／ピンチで拡大 · ゲーム本体は変更していません</span><span id="metrics"></span></footer>
<script type="module">
import * as T from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {loadHoundMotion as loadCandidate} from './candidate-motion.ts';
import {loadHoundMotion,HoundMotionBatch} from '/src/client/hound-motion.ts';
const canvas=document.querySelector('canvas'),renderer=new T.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x101918);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
const scene=new T.Scene();scene.fog=new T.Fog(0x101918,10,35);scene.add(new T.HemisphereLight(0xe3e9d8,0x27332e,2));
const key=new T.DirectionalLight(0xffe1b2,3.5);key.position.set(-4,7,-5);scene.add(key);
const rim=new T.DirectionalLight(0x9cded3,2.4);rim.position.set(4,4,4);scene.add(rim);
const fill=new T.DirectionalLight(0xd5e4e9,.8);fill.position.set(1,2,-4);scene.add(fill);
const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:0x19231e,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.012;scene.add(floor);
const grid=new T.GridHelper(100,100,0x344439,0x243127);grid.position.y=-.004;scene.add(grid);
const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.05,200),controls=new OrbitControls(camera,canvas);controls.target.set(0,.72,0);controls.maxPolarAngle=Math.PI*.49;controls.minDistance=2.5;controls.maxDistance=55;
let batch,asset,currentBatch,currentAsset,clip='Idle',time=0,playing=true,count=1,speed=1,sequence=false,view='oblique',compare=false,mono=false;
const matrix=new T.Matrix4(),white=new T.Color(0xffffff),ghost=new T.Color(0xff8866);
const styles=[];
function setView(name){view=name;let p={oblique:[4.4,2.6,-5.8],front:[0,1.65,-7.4],side:[7.4,1.65,0],rear:[0,1.65,7.4],game:[.8,3,-13]}[name];if(count>1)p=[15,14,-20];if(compare)p=[0,3.2,-14];camera.position.fromArray(p);controls.target.set(0,count>1?0:compare?1:.72,count>1?7:0);controls.update();}
function draw(t=time){if(!batch)return;time=t;let mode=clip,local=t;if(sequence){const tt=t%10;if(tt<2){mode='Idle';local=tt}else if(tt<6){mode='Locomotion';local=tt-2}else{mode='Lunge';local=(tt-6)%2}}
const poseTime=mode==='Lunge'?Math.min(1.2,local%2):local;
for(let i=0;i<count;i++){
matrix.makeTranslation(compare?-2.15:count===1?0:(i%8-3.5)*3.1,0,count===1?0:Math.floor(i/8)*3.5);
batch.setTransform(i,matrix,white);batch.setPose(i,mode,mode==='Lunge'?poseTime:poseTime+i*.117);
}
batch.finish(count);currentBatch.group.visible=compare;
if(compare){matrix.makeTranslation(2.15,0,0);currentBatch.setTransform(0,matrix);currentBatch.setPose(0,mode,poseTime);currentBatch.finish(1)}
renderer.render(scene,camera);
document.querySelector('#phase').textContent=mode==='Lunge'?(poseTime<.36?'胸の襞を開き、低く溜める':poseTime<.45?'圧縮 ─ 衝撃へ':poseTime<.6?'0.45秒 ─ 前方へ圧力を解放':'支持姿勢へ復帰'):mode==='Idle'?'待機 ─ 被覆と支持構造のずれ':`追跡 ─ 四肢の接地と背の折り畳み`;
document.querySelector('#metrics').textContent=`${count}体 · 4材質 · ${mode} ${poseTime.toFixed(2)}s`;
document.querySelector('#seek').value=poseTime;
}
function select(name){clip=name;sequence=false;time=0;document.querySelector('#seek').max={Idle:4,Locomotion:.8,Lunge:1.2}[name];document.querySelectorAll('[data-clip]').forEach(b=>b.classList.toggle('active',b.dataset.clip===name));draw()}
function setCompare(v){compare=v;count=1;document.querySelector('.labels').style.display=v?'flex':'none';setView(view);draw()}
function setMono(v){mono=v;for(const {mat,color,emission} of styles){mat.color.copy(v?new T.Color(0x151d18):color);mat.emissive.copy(v?new T.Color(0):emission)}renderer.setClearColor(v?0xcbd2c6:0x101918);floor.visible=!v;grid.visible=!v;draw()}
document.querySelectorAll('[data-clip]').forEach(b=>b.onclick=()=>select(b.dataset.clip));document.querySelector('#sequence').onclick=()=>{sequence=true;time=0};document.querySelector('#pause').onclick=()=>{playing=!playing;document.querySelector('#pause').textContent=playing?'一時停止':'再生'};
document.querySelector('#view').onchange=e=>setView(e.target.value);document.querySelector('#speed').onchange=e=>speed=+e.target.value;document.querySelector('#count').onchange=e=>{setCompare(false);count=+e.target.value;setView(view);draw()};document.querySelector('#compare').onclick=()=>setCompare(!compare);document.querySelector('#mono').onclick=()=>setMono(!mono);document.querySelector('#seek').oninput=e=>{playing=false;draw(+e.target.value)};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);draw()});
try{
[asset,currentAsset]=await Promise.all([loadCandidate(),loadHoundMotion()]);batch=new HoundMotionBatch(asset,80);currentBatch=new HoundMotionBatch(currentAsset,1);scene.add(batch.group,currentBatch.group);
for(const b of [batch,currentBatch])for(const p of b.parts)styles.push({mat:p.material,color:p.material.color.clone(),emission:p.material.emissive.clone()});
setView(view);select('Idle');window.houndMotion={asset,batch,currentAsset,currentBatch,scene,camera,renderer,draw,select,setView,setCompare,setMono,setCount(n){compare=false;count=n;setView(view);draw()},setPlaying(v){playing=v},setSequence(v){sequence=v;time=0},get time(){return time},ready:true};
controls.addEventListener('change',()=>draw());let last=performance.now();function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(playing){time+=dt*speed;draw()}requestAnimationFrame(loop)}requestAnimationFrame(loop);
}catch(e){document.querySelector('#phase').textContent='読込失敗: '+String(e);window.houndMotion={error:String(e)};throw e}
</script></html>
