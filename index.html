<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c1820" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icon-swarm-v3-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-swarm-v3-180.png" sizes="180x180" />
    <title>SWARM FRONT</title>
    <meta name="description" content="SWARM FRONT — 仲間と戦う3D協力アクション。" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SWARM FRONT" />
    <meta property="og:title" content="SWARM FRONT" />
    <meta property="og:description" content="SWARM FRONT — 仲間と戦う3D協力アクション。" />
    <meta property="og:url" content="https://swarm-front.melosalife-24.workers.dev/" />
    <meta property="og:image" content="https://swarm-front.melosalife-24.workers.dev/share-swarm-front-20260920.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="1280" />
    <meta property="og:image:alt" content="SWARM FRONTのロゴと青緑色の戦場" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SWARM FRONT" />
    <meta name="twitter:description" content="SWARM FRONT — 仲間と戦う3D協力アクション。" />
    <meta name="twitter:image" content="https://swarm-front.melosalife-24.workers.dev/share-swarm-front-20260920.jpg" />
    <meta name="twitter:image:alt" content="SWARM FRONTのロゴと青緑色の戦場" />
  </head>
  <body>
    <canvas id="world" aria-label="三人称3D戦場"></canvas>
    <main id="ui"></main>
    <div id="hud" hidden></div>
    <canvas id="minimap" aria-label="戦場のミニマップ" hidden></canvas>
    <div id="damage" aria-hidden="true"></div>
    <div id="scope-overlay" aria-hidden="true" hidden><span>2×</span></div>
    <button id="pause" aria-label="一時停止メニュー" hidden>| |</button>
    <div id="pause-menu" role="dialog" aria-label="一時停止" hidden></div>
    <div id="controls" hidden>
      <div id="move" aria-label="移動スティック"><span></span></div>
      <div id="look" aria-label="視点操作"></div>
      <button id="fire">射撃</button><button id="dodge">回避</button
      ><button id="reload">装填</button><button id="swap">切替</button
      ><button id="revive">蘇生</button>
      <button
        id="scope"
        type="button"
        aria-label="スコープ"
        aria-pressed="false"
        hidden
      >
        スコープ
      </button>
    </div>
    <div id="portrait" role="dialog" aria-modal="true" aria-label="ゲーム開始">
      <strong>SWARM FRONT</strong>
      <button id="landscape-start" type="button">ゲームを開始</button>
      <small id="landscape-status" role="status"></small>
    </div>
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
      async
      defer
    ></script>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
