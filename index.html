<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c1820" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #080e13;
        color: #d9edf0;
      }
      #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: grid;
        place-content: center;
        gap: 1rem;
        background: radial-gradient(ellipse at center, #15313a, #080e13 70%);
        text-align: center;
        font:
          600 1rem system-ui,
          sans-serif;
        letter-spacing: 0.08em;
      }
      #boot-screen small {
        color: #91b6bc;
        font-size: 0.8rem;
        font-weight: 400;
        letter-spacing: 0;
      }
      #boot-screen::after {
        content: "";
        width: 2rem;
        height: 2rem;
        margin: 0 auto;
        border: 2px solid #557d83;
        border-top-color: #bce8de;
        border-radius: 50%;
        animation: boot-turn 1s linear infinite;
      }
      @keyframes boot-turn {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-screen::after {
          animation: none;
        }
      }
      body:has(#ui > *) #boot-screen {
        display: none;
      }
    </style>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icon-swarm-v4-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-swarm-v4-180.png" sizes="180x180" />
    <link rel="stylesheet" href="/src/client/landscape.css" />
    <title>SWARM FRONT</title>
    <meta name="description" content="SWARM FRONT — 仲間と戦う3D協力アクション。" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SWARM FRONT" />
    <meta property="og:title" content="SWARM FRONT" />
    <meta property="og:description" content="SWARM FRONT — 仲間と戦う3D協力アクション。" />
    <meta property="og:url" content="https://swarm-front.melosalife-24.workers.dev/" />
    <meta property="og:image" content="https://swarm-front.melosalife-24.workers.dev/share-swarm-front-20260920.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:image:alt" content="SWARM FRONTのロゴと青緑色の戦場" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SWARM FRONT" />
    <meta name="twitter:description" content="SWARM FRONT — 仲間と戦う3D協力アクション。" />
    <meta name="twitter:image" content="https://swarm-front.melosalife-24.workers.dev/share-swarm-front-20260920.jpg" />
    <meta name="twitter:image:alt" content="SWARM FRONTのロゴと青緑色の戦場" />
  </head>
  <body>
    <div id="boot-screen" role="status" aria-label="画面を読み込み中">
      SWARM FRONT<small>画面を読み込んでいます</small>
    </div>
    <canvas id="world" aria-label="三人称3D戦場"></canvas>
    <main id="ui"></main>
    <div id="hud" hidden></div>
    <canvas id="minimap" aria-label="戦場のミニマップ" hidden></canvas>
    <div id="damage" aria-hidden="true"></div>
    <div id="scope-overlay" aria-hidden="true" hidden><span>2×</span></div>
    <button id="pause" aria-label="一時停止メニュー" hidden>| |</button>
    <div id="pause-menu" role="dialog" aria-label="一時停止" hidden></div>
    <div id="controls" hidden>
      <div id="move" aria-label="移動スティック"><span></span></div>
      <div id="look" aria-label="視点操作"></div>
      <button id="fire">射撃</button><button id="dodge">回避</button
      ><button id="reload">装填</button><button id="swap">切替</button
      ><button id="revive">蘇生</button>
      <button
        id="scope"
        type="button"
        aria-label="スコープ"
        aria-pressed="false"
        hidden
      >
        スコープ
      </button>
    </div>
    <div id="portrait" role="dialog" aria-modal="true" aria-label="ゲーム開始" aria-describedby="landscape-guide landscape-status">
      <strong>SWARM FRONT</strong>
      <p id="landscape-guide">端末を横向きにしてお楽しみください</p>
      <button id="landscape-start" type="button">ゲームを開始</button>
      <small id="landscape-status" role="status">画面が回らない場合は、端末の画面回転ロックを解除してください。</small>
    </div>
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
      async
      defer
    ></script>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
